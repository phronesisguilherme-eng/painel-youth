<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF9F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Youth">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body><title>Painel Youth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: Youth Worship manual look — black cover band with logo and the pink/yellow/violet/grey stripe,
   paper pages with grey rounded panels, condensed uppercase headlines, sticker shadows in brand pink. */
:root{
  --bg:#FBF9F4; --surface:#FFFDF8; --card:#F1EFEA; --ink:#0B0B0C; --muted:#5E5A55; --line:#E2DED6;
  --accent:#E8003F; --accent-ink:#FFFFFF; --soft:#FDE3EA; --sun:#FFD004; --sun-ink:#1A1400; --violet:#5A11E7;
  --tile-bg:#0B0B0C; --tile-ink:#FBF9F4;
  --head-bg:#FBF9F4; --head-ink:#0B0B0C; --head-muted:#5E5A55;
  --ok:#12804F; --warn:#A35F00; --bad:#C8102E; --shadow:0 1px 2px rgba(11,11,12,.06),0 8px 24px rgba(11,11,12,.08);
  --f-display:"Anton",Impact,"Arial Narrow",sans-serif;
  --f-body:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Courier Prime","Courier New",ui-monospace,monospace;
  --f-hand:"Permanent Marker","Comic Sans MS",cursive;
}
/* Single paper look on purpose: the manual's off-white pages, in light and dark system themes alike. */
:root{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:10px}
.mark h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.mark h1 i{font-style:normal;background:var(--sun);color:var(--sun-ink);padding:0 6px;border-radius:4px;margin-left:2px}
.mark span{color:var(--muted);font-size:13px}
#status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--ok)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:24px 64px}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.banner b{font-weight:700}

/* Toolbar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar h2{font-size:26px;font-weight:800;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn.danger{color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Cards & tiles */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.stack{display:grid;gap:12px}
.tile{flex:none;width:58px;border-radius:10px;background:var(--ink);color:var(--bg);text-align:center;padding:6px 0 7px;font-family:var(--f-mono);line-height:1.1}
.tile span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.tile b{display:block;font-size:24px;font-weight:700;margin:2px 0}
.tile.past{background:var(--line);color:var(--muted)}
.item{display:flex;gap:14px;align-items:flex-start}
.item .body{flex:1;min-width:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.key{font-family:var(--f-mono);background:var(--sun);color:var(--sun-ink)}
.chip.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin-top:12px}
.meta div{min-width:0}
.meta dt{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.meta dd{margin:0;font-weight:600;overflow-wrap:anywhere}
details{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.order{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:0}
.order li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.order li:last-child{border-bottom:0}
.songs{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.songs li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.songs .n{font-family:var(--f-mono);color:var(--muted);font-size:12px;width:20px}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.next{border:2px solid var(--ink);box-shadow:var(--shadow)}
.next h3{font-size:30px;font-weight:800;letter-spacing:-.015em;margin-top:4px}
.count{font-family:var(--f-mono);font-size:13px;background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:2px 8px;font-weight:700}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.sect-h h3{font-size:18px;font-weight:700}
.list{display:grid;gap:0}
.list > div{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;justify-content:space-between;min-width:0}
.list > div:last-child{border-bottom:0}
.list .t{min-width:0;overflow-wrap:anywhere}

/* Agenda */
.month{font-family:var(--f-display);font-size:18px;font-weight:700;margin:22px 0 10px}
.month:first-child{margin-top:0}

/* Escalas */
.roles{display:grid;gap:6px;margin-top:8px}
.role{display:grid;grid-template-columns:190px 1fr auto;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.role:last-child{border-bottom:0}
.role b{font-size:13px}

/* Tarefas */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.col h3{font-size:15px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:10px}
.task{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);display:grid;gap:6px}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:600;overflow-wrap:anywhere}
.task .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}

/* Avisos */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
.note p{white-space:pre-wrap;margin:8px 0 0;overflow-wrap:anywhere}
.note.pinned{border-color:var(--sun);border-width:2px}

/* Repertório */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.empty{border:1.5px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:18px}

/* Dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,24,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:20px;font-weight:800}
.db{padding:18px 20px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.df{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:grid;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg)}
.fld textarea{min-height:84px;resize:vertical}
.fld.check{display:flex;align-items:center;gap:8px}
.fld.check input{width:auto}
.rep{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.rep-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rep-h b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rrow{display:grid;gap:6px;align-items:center}
.rrow.m{grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 70px 32px}
.rrow.o{grid-template-columns:142px minmax(0,2fr) minmax(0,1.4fr) 32px}
.rrow input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--bg);min-width:0}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px}
.x:hover{color:var(--bad)}

.steps{display:flex;gap:4px;overflow-x:auto;padding:10px 20px 0;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{border:0;background:none;padding:8px 10px 10px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:14px}
.steps button span{font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line)}
.steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent)}
.steps button[aria-current="step"] span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.db[data-panel]{flex:1;align-content:start;min-height:300px}
.hint-step{grid-column:1/-1;margin:0;color:var(--muted);font-size:14px}
#resumo{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;background:var(--bg)}
#resumo h3{font-size:20px;font-weight:800}
#resumo .warn{color:var(--warn);font-size:14px;font-weight:600}
.dwrap{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dwrap .dh h2{font-size:21px}
.dbody{padding:18px 20px 22px;overflow-y:auto;min-height:280px}
.agenda-item{cursor:pointer}
.agenda-item:hover{border-color:var(--muted)}
.linkish{border:0;background:none;padding:0;font:inherit;font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.linkish:hover{color:var(--accent)}
.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg);font-size:14px;flex:none}
.editbar.open{display:grid;gap:12px;max-height:55vh;overflow-y:auto;padding-block:16px}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qgrid .fld.full{grid-column:1/-1}
.qgrid .fld input,.qgrid .fld select,.qgrid .fld textarea{background:var(--surface)}
@media (max-width:560px){.qgrid{grid-template-columns:1fr 1fr}}
.hright{display:flex;align-items:center;gap:12px}
.bellwrap{position:relative}
.bellbtn{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.bellbtn:hover{border-color:var(--muted)}
#bellcount{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font:700 11px/18px var(--f-mono);border-radius:999px;min-width:18px;height:18px;padding:0 5px;text-align:center}
#bellpop{position:absolute;right:0;top:46px;width:min(340px,calc(100vw - 32px));max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:14px;z-index:30;display:grid;gap:10px}
.fld select#me-sel{background:var(--bg)}
.notif{display:grid;gap:3px;text-align:left;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg);cursor:pointer;width:100%}
.notif.unread{border-color:var(--accent);border-width:2px}
.notif:hover{border-color:var(--muted)}
.mlist{display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface);box-shadow:var(--shadow)}
.mlist button{text-align:left;border:0;background:none;padding:7px 9px;border-radius:6px;cursor:pointer;font-weight:600}
.mlist button:hover,.mlist button:focus-visible{background:var(--soft)}
.mention{color:var(--accent);font-weight:700}
/* ---- Youth Worship brand layer ---- */
h3{font-family:var(--f-body)}
body::before{background:var(--head-bg)}
header.top{background:var(--head-bg);color:var(--head-ink);border-bottom:0}
.brand{padding-block:14px 8px}
.mark{align-items:center;gap:14px}
.mark .logo{height:42px;width:auto;display:block}
.mark .tag{font-family:var(--f-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--head-muted);line-height:1.3;max-width:150px}
.hand{font-family:var(--f-hand);color:var(--violet);font-size:15px;line-height:1.25;margin:0;transform:rotate(-2deg);max-width:300px}
@media (max-width:900px){.hand{display:none}}
#status{color:var(--head-muted);font-family:var(--f-mono);font-size:12px}
.tabs button{color:var(--head-muted);font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.05em;text-transform:uppercase;padding:10px 14px 9px}
.tabs button:hover{color:var(--head-ink)}
.tabs button[aria-current="page"]{color:var(--head-ink);border-bottom-color:var(--accent)}
.stripes{display:grid;grid-template-columns:4fr 3fr 2fr 1fr;height:6px}
.stripes i:nth-child(1){background:#FE003E}
.stripes i:nth-child(2){background:#FFD004}
.stripes i:nth-child(3){background:#5A11E7}
.stripes i:nth-child(4){background:#878787}
.bellbtn{background:var(--surface);border:2px solid var(--ink);color:var(--ink)}
.bellbtn:hover{border-color:var(--accent);color:var(--accent)}
#bellcount{background:#FE003E}
#bellpop{color:var(--ink);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--accent)}

.bar h2{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,6vw,56px);text-transform:uppercase;letter-spacing:.01em;line-height:.95;position:relative;padding-bottom:14px}
.bar h2::after{content:"";position:absolute;left:0;bottom:0;width:min(100%,240px);height:7px;border-radius:7px;background:var(--ink);transform:rotate(-1.2deg)}
.bar h2 em{font-style:normal;color:var(--accent)}
.card,.col,.tablewrap{background:var(--card);border:0;border-radius:18px}
.task{background:var(--surface);border-color:transparent;border-radius:12px}
.col h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:22px;letter-spacing:.02em}
.next{background:var(--surface);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--accent)}
.next h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:44px;line-height:1;letter-spacing:.01em}
.sect-h h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:24px;letter-spacing:.02em}
.month{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:30px;color:var(--accent);letter-spacing:.02em}
.tile{background:var(--tile-bg);color:var(--tile-ink);border-radius:12px;width:62px;padding:7px 0 8px}
.tile b{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1;margin:3px 0}
.tile span{font-weight:700;opacity:.85}
.tile.past{background:var(--line);color:var(--muted)}
.eyebrow,.meta dt,.fld label,th{font-family:var(--f-mono);letter-spacing:.05em}
.btn{border-radius:999px;border:2px solid var(--ink);background:transparent;font-weight:600}
.btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:none;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.btn.ghost:hover{background:var(--soft);color:var(--ink);border-color:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.seg{background:var(--card);border:0}
.seg button{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{font-family:var(--f-mono);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;padding:3px 10px}
.chip.key{background:var(--sun);color:var(--sun-ink)}
.linkish{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:28px;letter-spacing:.01em;line-height:1.05}
.linkish:hover{color:var(--accent)}
.agenda-item{transition:box-shadow .15s, transform .15s}
.agenda-item:hover{box-shadow:6px 6px 0 var(--accent);transform:translate(-2px,-2px)}
@media (prefers-reduced-motion:reduce){.agenda-item{transition:none}.agenda-item:hover{transform:none}}
.empty{border:2px dashed var(--line);background:transparent;border-radius:18px}
.empty strong{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:26px;letter-spacing:.02em}
.banner{background:var(--sun);color:var(--sun-ink);border:0;border-radius:14px}
dialog{border-radius:20px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--accent);background:var(--surface)}
.dh{background:var(--head-bg);color:var(--head-ink);border-bottom:0}
.dh h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:30px;letter-spacing:.01em;line-height:1}
.dh{border-bottom:1px solid var(--line)}
.dh .eyebrow{color:var(--accent)}
.dh .x{color:var(--head-ink)}
.dh .tile{background:#E8003F;color:#fff}
.steps{background:var(--surface)}
.steps button{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.04em;font-size:17px}
.steps button[aria-current="step"]{border-bottom-color:var(--accent)}
.steps button[aria-current="step"] span{background:var(--accent);border-color:var(--accent)}
.editbar{background:var(--card)}
.order li span.mono{color:var(--accent);font-weight:700}
.mention{color:var(--violet)}
.songs .n{color:var(--accent);font-weight:700}
#toast{border-radius:999px}

/* Task rows inside grey panels (Início, event Informações): white base so undated tasks still stand out. */
.tlist-mini{display:grid;gap:8px}
.card .todo,.dbody .todo{background:var(--surface)}
.card .todo.dl-ok,.dbody .todo.dl-ok{background:var(--dl-ok)}

.dbody .todo + .todo{margin-top:8px}
.todo .tbody .row{gap:5px}
.todo .chip{white-space:normal;max-width:100%}

/* Equipe e usuários (admin) */
.ulist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.urow{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px}
.urow.editing{display:block}
.ubody{flex:1;min-width:0;display:grid;gap:3px}
.ubody b{overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ubody .mono{font-size:12px;overflow-wrap:anywhere}
.uform{display:grid;gap:10px}
.unew{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:2px solid var(--ink)}
.unew h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:20px}

.ugrid input,.ugrid select{background:var(--surface)}
@media (max-width:640px){.ugrid{grid-template-columns:1fr}.urow{flex-wrap:wrap}.urow > .btn{margin-left:52px}}

/* Menu da conta */
.menuwrap{position:relative}
#menupop{position:absolute;right:0;top:46px;width:min(300px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--accent);padding:8px;z-index:30;display:grid;gap:2px}
.mhead{display:flex;gap:10px;align-items:center;padding:8px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.mhead > div{display:grid;gap:2px;min-width:0}
.mhead b{font-size:15px;overflow-wrap:anywhere}
.mhead .mono{font-size:11px;overflow-wrap:anywhere}
.mavatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;flex:none}
.mrow{display:flex;gap:8px;align-items:flex-end}
.mrow .fld{padding:4px}
.mrow .btn{margin:0 4px 4px 0}
.mitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);text-align:left}
.mitem svg{width:18px;height:18px;flex:none}
.mitem:hover,.mitem:focus-visible{background:var(--soft)}
.mout{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}

/* Online agora */
#online{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.on-label{font-family:var(--f-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.on-person{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:3px 9px 3px 7px;font-size:12px;font-weight:600;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.on-dot{width:8px;height:8px;border-radius:50%;background:#1FB866;box-shadow:0 0 0 2px rgba(31,184,102,.25);flex:none}

@media (max-width:640px){
  #online{gap:4px;max-width:150px;flex-wrap:nowrap}
  .on-label,.on-more-m,.on-extra{display:none}
  .on-count-m{display:inline-flex;color:var(--muted);padding:3px 7px}
  .on-person{font-size:11px;max-width:90px}
}

/* Chat */
#chatfab-wrap{position:fixed;z-index:25;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#chatfab{width:64px;height:64px;border:0;background:none;padding:0;cursor:pointer;color:#E8003F;filter:drop-shadow(3px 3px 0 #0B0B0C);transition:transform .15s}
#chatfab svg{width:100%;height:100%}
#chatfab:hover{transform:rotate(30deg) scale(1.06)}
#chatfab:focus-visible{outline:2px solid #0B0B0C;outline-offset:4px;border-radius:50%}
@media (prefers-reduced-motion:reduce){#chatfab{transition:none}#chatfab:hover{transform:none}}
#chatfab .cbadge{position:absolute;top:-4px;right:-6px;background:#FFD004;color:#0B0B0C;border-color:#0B0B0C;min-width:24px;height:24px;font-size:12px}
#chatfab.has-new{animation:fab-pulse 1.6s ease-in-out infinite}
#chatfab.has-new::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid #FFD004;animation:fab-ring 1.6s ease-out infinite;pointer-events:none}
#chatfab.bump{animation:fab-bump .6s ease-out, fab-pulse 1.6s ease-in-out .6s infinite}
@keyframes fab-pulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(20deg)}}
@keyframes fab-ring{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.35)}}
@keyframes fab-bump{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-25deg)}60%{transform:scale(.95) rotate(15deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#chatfab.has-new,#chatfab.bump{animation:none}#chatfab.has-new::after{animation:none;opacity:1;transform:none}}
#chatfab-x{position:absolute;top:-6px;left:-8px;width:22px;height:22px;border-radius:50%;border:2px solid #FFFFFF;background:#0B0B0C;color:#FFFFFF;font-size:14px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
#chatfab-x:hover{background:#E8003F}
.cbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#0B0B0C;color:#fff;font:700 11px/1 var(--f-mono);border:2px solid #FFFFFF}
#chatpanel{position:fixed;z-index:30;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));height:min(620px,calc(100vh - 120px));height:min(620px,calc(100dvh - 120px));border:3px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--accent);overflow:hidden;background:var(--card)}
#chatwrap{display:flex;flex-direction:column;height:100%;background:var(--card)}
.chat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.chat-head > div{display:grid;gap:2px;min-width:0}
.chat-x{font-size:26px;padding:2px 6px;margin:-4px -4px 0 0}
.chat-head h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:26px;letter-spacing:.01em}
.chat-as{font-size:13px}
.chat-as input{border:1px solid var(--ink);border-radius:6px;padding:3px 8px;background:var(--bg);width:150px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
#chatlist{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.chat-empty{margin:auto;text-align:center;display:grid;gap:4px;padding:20px}
.chat-empty strong{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:22px}
.cday{display:flex;justify-content:center;margin:12px 0 6px}
.cday span{font-family:var(--f-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.bubble{max-width:min(78%,520px);background:var(--surface);border-radius:16px 16px 16px 4px;padding:8px 12px 6px;display:grid;gap:2px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.msg.me .bubble{background:var(--accent);color:#fff;border-radius:16px 16px 4px 16px}
.bubble .who{font-size:12px;color:var(--violet)}
.bubble p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
.msg.me .mention{color:#fff;text-decoration:underline;font-weight:700}
.mtime{justify-self:end;font-family:var(--f-mono);font-size:10px;opacity:.7}
.mdel{border:0;background:none;color:inherit;font:inherit;padding:0 0 0 4px;cursor:pointer;text-decoration:underline;opacity:.85}
.chat-mlist{margin:0 12px 6px;max-height:190px;overflow-y:auto}
.chat-compose{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.chat-compose textarea{flex:1;min-width:0;resize:none;border:2px solid var(--ink);border-radius:20px;padding:9px 14px;background:var(--bg);font:inherit;line-height:1.35;max-height:140px}
.chat-compose textarea:focus{outline:none;border-color:var(--accent)}
.chat-send{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer}
.chat-send:hover{background:var(--ink)}
@media (max-width:640px){
  #chatfab-wrap{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:max(14px,calc(env(safe-area-inset-right,0px) + 10px))}
  #chatfab{width:56px;height:56px}
  #chatpanel{inset:0;width:100%;height:100%;border:0;border-radius:0;box-shadow:none;z-index:35;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--surface)}
  .chat-head{padding:10px 12px 8px 16px}
  .chat-head h2{font-size:20px}
  .bubble{max-width:84%}
}

/* Cronograma (event window) */
.cr-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0;background:var(--card);border-radius:14px;padding:14px 16px}
.cr-info div{min-width:0}
.cr-info dt{font-family:var(--f-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cr-info dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.cr-sect{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 8px;padding-bottom:6px;border-bottom:2.5px solid var(--ink)}
.cr-sect h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:20px;letter-spacing:.03em;color:var(--accent)}
.cr-list,.cr-songs{list-style:none;margin:0;padding:0;display:grid}
.cr-row{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,.8fr);gap:12px;align-items:start;padding:11px 12px;border-radius:10px}
.cr-row:nth-child(odd){background:var(--card)}
.cr-time{display:grid;gap:1px;font-family:var(--f-mono)}
.cr-time b{color:var(--accent);font-size:15px}
.cr-time small{color:var(--muted);font-size:11px}
.cr-what{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.cr-what b{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.cr-dur{font-family:var(--f-mono);font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 8px;white-space:nowrap}
.cr-who{color:var(--muted);font-size:14px;text-align:right;overflow-wrap:anywhere}
.cr-songs li{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.cr-songs li:last-child{border-bottom:0}
.cr-n{font-family:var(--f-mono);font-weight:700;color:var(--accent);width:22px;flex:none}
.cr-song{flex:1;min-width:0;display:grid}
.cr-song b{overflow-wrap:anywhere}
.cr-song small{color:var(--muted);font-size:13px}
@media (max-width:640px){
  .cr-info{grid-template-columns:1fr 1fr;padding:12px 14px;gap:10px 14px}
  .cr-row{grid-template-columns:56px minmax(0,1fr);gap:3px 10px;padding:10px}
  .cr-time{grid-row:span 2;white-space:nowrap}
  .cr-time b{font-size:14px}
  .cr-who{grid-column:2;text-align:left;font-size:13px}
  .cr-who:empty{display:none}
  .cr-what b{font-size:14px}
  .editbar:not(.open) > span{display:none}
  .editbar:not(.open){padding:8px 16px;justify-content:flex-end}
  .editbar:not(.open) .btn{padding:5px 12px;font-size:13px}
}

/* Histórico */
.hist-sub{margin:-6px 0 6px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hrow{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:12px;padding:10px 14px;border-left:4px solid var(--hc)}
.hdot{width:10px;height:10px;border-radius:50%;background:var(--hc);margin-top:6px;flex:none}
.hbody{flex:1;min-width:0;display:grid;gap:2px;overflow-wrap:anywhere}
.hdet{font-size:13px}
.htime{font-size:12px;flex:none}

/* Calendário */
.cal{background:var(--card);border-radius:18px;padding:14px}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-head h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:24px;letter-spacing:.02em;flex:1;text-align:center}
.cal-head .btn.ghost{font-size:22px;padding:2px 12px;text-decoration:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-family:var(--f-mono);font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal-cell{min-height:92px;background:var(--surface);border:2px solid transparent;border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;color:var(--ink);min-width:0;font:inherit}
.cal-cell.vazio{background:transparent;cursor:default}
.cal-cell:hover{border-color:var(--line)}
.cal-cell.passado{opacity:.6}
.cal-cell.hoje .cal-n{background:var(--accent);color:#fff}
.cal-cell.sel{border-color:var(--ink)}
.cal-n{font-family:var(--f-mono);font-weight:700;font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.cal-evs{display:grid;gap:2px;min-width:0}
.cal-ev{font-size:11px;line-height:1.25;background:var(--soft);border-left:3px solid var(--accent);border-radius:4px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev b{font-family:var(--f-mono);font-size:10px}
.cal-mais{font-size:11px;color:var(--muted);font-weight:600}
.cal-dots{display:none;gap:3px;justify-content:center;margin-top:auto}
.cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.addcal{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:8px}
@media (max-width:640px){
  .cal{padding:10px;border-radius:14px}
  .cal-grid{gap:3px}
  .cal-cell{min-height:52px;padding:4px 2px;align-items:center}
  .cal-evs{display:none}
  .cal-dots{display:flex}
  .cal-head h3{font-size:20px}
}

/* Arquivos */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.folder{display:grid;gap:6px;justify-items:start;text-align:left;background:var(--card);border:2px solid transparent;border-radius:18px;padding:18px;cursor:pointer;color:var(--ink)}

.folder-ico{width:54px;height:54px;color:var(--fc)}

.fbody{flex:1;min-width:0;display:grid;gap:2px}
.fname{font-weight:600;overflow-wrap:anywhere;line-height:1.3}

.factions{display:flex;gap:4px;flex:none;align-items:center}
.danger-txt{color:var(--bad)!important;text-decoration-color:var(--bad)!important}

<script>
const COLS = ['cultos','eventos','escalas','tarefas','avisos','arquivos'];
const state = {cultos:[],eventos:[],escalas:[],tarefas:[],avisos:[],arquivos:[]};
const loaded = {};
let db = null, mode = 'loading', canWrite = true;
const TABS = ['inicio','agenda','tarefas','avisos','arquivos','historico'];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : (()=>{try{return localStorage.getItem('youth-tab')||'inicio'}catch(e){return 'inicio'}})();
if(!TABS.includes(tab)) tab='inicio';
const seg = {agenda:'proximos', tarefas:'abertas', hist:'todos'};
let pastaAberta = null; // folder open in the Arquivos tab

const areaRank = a => { const i = AREAS.indexOf(a); return i < 0 ? 98 : i; };
const AREAS = ['Louvor','Recepção','Mídia / Projeção','Som','Fotografia','Intercessão','Ceia','Limpeza / Lanche','Outros'];
const TIPOS = ['Evento Awake','Evento Storm','Youth Hangout','Treinamento','Culto especial','Retiro','Acampamento','Reunião de equipe','Evangelismo','Social / Comunhão','Ensaio','Outro'];
const STATUS = [['afazer','A fazer'],['fazendo','Fazendo'],['feito','Feito']];
const PRIOS = ['Normal','Alta','Baixa'];
// [início, momento, quem conduz: dir = dirigente, lv = ministro de louvor, pre = preletor]
const ORDEM_PADRAO = [
  ['19:30','Oração inicial (10 min)','dir'],
  ['19:40','Abertura + Louvor (30 min)','lv'],
  ['20:10','Ministração (5 min)','dir'],
  ['20:15','Avisos + Visitantes (5 min)','dir'],
  ['20:20','Louvor oferta (5 min)','lv'],
  ['20:25','Palavra (40 min)','pre'],
  ['21:05','Música final (5 min)','lv']
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const parseD = s => { const [y,m,d] = (s||'').split('-').map(Number); return new Date(y||1970,(m||1)-1,d||1); };
const WD = ['dom','seg','ter','qua','qui','sex','sáb'];
const MO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WDF = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MOF = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const fmtD = s => { if(!s) return 'Sem data'; const d = parseD(s); return `${WD[d.getDay()]}, ${pad(d.getDate())} ${MO[d.getMonth()]}`; };
const daysUntil = s => Math.round((parseD(s) - parseD(todayStr())) / 864e5);
const rel = s => { if(!s) return ''; const n = daysUntil(s); if(n===0) return 'hoje'; if(n===1) return 'amanhã'; if(n===-1) return 'ontem'; return n>1 ? `em ${n} dias` : `há ${-n} dias`; };
const tile = (s, past) => { if(!s) return `<div class="tile${past?' past':''}"><span>—</span><b>?</b><span></span></div>`; const d = parseD(s); return `<div class="tile${past?' past':''}" aria-label="${esc(fmtD(s))}"><span>${MO[d.getMonth()]}</span><b>${d.getDate()}</b><span>${WD[d.getDay()]}</span></div>`; };
const byDate = (arr, dir=1) => [...arr].sort((a,b) => dir * (((a.data||'9999')+(a.hora||'')).localeCompare((b.data||'9999')+(b.hora||''))));
const W = html => canWrite ? html : '';

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=> t.hidden = true, 2600); }

/* ---------- Data ----------
   Two backends: the claude.ai artifact store (when opened as an Artifact) and Supabase (the
   standalone webapp, which loads config.js with window.YOUTH_CONFIG and supabase-js before this script). */
const CFG = window.YOUTH_CONFIG || null;
let sb = null, sbUser = null, isAdmin = false; // isAdmin: only the admin uploads or deletes files
const A = html => (canWrite && isAdmin) ? html : '';
async function init(){
  render();
  if(CFG && CFG.supabaseUrl) return initSupabase();
  const c = window.claude;
  if(!c || typeof c.use !== 'function'){ mode = 'local'; render(); return; }
  try { db = await c.use('db'); } catch(e){ db = null; }
  if(!db){ mode = 'local'; render(); return; }
  try {
    const user = await c.use('user');
    const w = user ? await user.can('data.write') : null;
    if(w === false) canWrite = false;
  } catch(e){}
  mode = 'live';
  COLS.forEach(name => {
    db.collection(name).onSnapshot(snap => {
      state[name] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      loaded[name] = true;
      render();
    }, () => toast('A sincronização parou. Recarregue a página.'));
  });
  render();
}

async function initSupabase(){
  if(!window.supabase || !CFG.supabaseAnonKey){ mode = 'local'; render(); toast('Configuração do banco incompleta. Confira o arquivo config.js.'); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {persistSession: true, autoRefreshToken: true}});
  const {data} = await sb.auth.getSession();
  if(data && data.session) return startSupabase(data.session.user);
  $('#login').hidden = false; setTimeout(() => { const f = $('#lg-email'); if(f) f.focus(); }, 0);
}
/* Team roster from public.membros (email, nome, papel). Before 6-nomes-da-equipe.sql a member only sees
   their own row and there is no "nome" column, so both shapes are handled. */
let equipe = [];
async function loadEquipe(){
  let r = await sb.from('membros').select('email,nome,papel');
  if(r.error) r = await sb.from('membros').select('email,papel');
  equipe = (r.data || []).map(m => ({email: m.email, nome: m.nome || '', papel: m.papel}));
  const me = equipe.find(m => lower(m.email) === lower(sbUser && sbUser.email));
  isAdmin = !!(me && me.papel === 'admin');
}
/* Who is online right now: Supabase Realtime Presence. Each open app announces only its user id and
   display name; the header lists everyone else currently connected. Nothing is stored. */
let presenceCh = null, online = [];
function startPresence(){
  if(!sb || !sbUser || presenceCh) return;
  presenceCh = sb.channel('presenca-youth', {config: {presence: {key: sbUser.id}}});
  presenceCh.on('presence', {event: 'sync'}, () => {
    const st = presenceCh.presenceState();
    online = Object.entries(st).filter(([id]) => id !== sbUser.id)
      .map(([id, metas]) => ({id, nome: (metas[0] && metas[0].nome) || 'Alguém'}))
      .sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
    renderOnline();
  }).subscribe(async status => { if(status === 'SUBSCRIBED') await presenceCh.track({nome: myName()}); });
}
function retrackPresence(){ if(presenceCh) presenceCh.track({nome: myName()}).catch(() => {}); }
function renderOnline(){
  const el = $('#online'); if(!el) return;
  if(!sb || !online.length){ el.hidden = true; el.innerHTML = ''; return; }
  const shown = online.slice(0, 4), extra = online.length - shown.length;
  el.hidden = false;
  el.title = 'Online agora: ' + online.map(p => p.nome).join(', ');
  el.innerHTML = `<span class="on-label">Online</span>${shown.map((p, i) => `<span class="on-person${i ? ' on-more-m' : ''}"><i class="on-dot" aria-hidden="true"></i>${esc(p.nome)}</span>`).join('')}${extra > 0 ? `<span class="on-person on-extra">+${extra}</span>` : ''}${online.length > 1 ? `<span class="on-person on-count-m">+${online.length - 1}</span>` : ''}`;
  el.setAttribute('aria-label', 'Online agora: ' + online.map(p => p.nome).join(', '));
}
const memberName = m => m.nome || m.email.split('@')[0].replace(/^./, ch => ch.toUpperCase());
async function startSupabase(user){
  sbUser = user; $('#login').hidden = true;
  mode = 'live'; canWrite = true; render();
  await loadEquipe();
  startPresence();
  const {data, error} = await sb.from('registros').select('colecao,id,dados').limit(10000);
  if(error){ toast('Sem acesso aos dados: ' + error.message); canWrite = false; COLS.forEach(c => loaded[c] = true); render(); return; }
  COLS.forEach(c => { state[c] = []; loaded[c] = true; });
  (data || []).forEach(r => { if(state[r.colecao]) state[r.colecao].push({...r.dados, id: r.id}); });
  render();
  sb.channel('registros-youth').on('postgres_changes', {event: '*', schema: 'public', table: 'registros'}, p => {
    const r = p.eventType === 'DELETE' ? p.old : p.new; if(!r || !state[r.colecao]) return;
    if(p.eventType === 'DELETE') state[r.colecao] = state[r.colecao].filter(x => x.id !== r.id);
    else { const rec = {...r.dados, id: r.id}, arr = state[r.colecao], i = arr.findIndex(x => x.id === rec.id); if(i >= 0) arr[i] = rec; else arr.push(rec); }
    render();
  }).subscribe();
  loadChat().then(() => { if(location.hash === '#chat') openChat(); });
  checkPush();
  sb.channel('mensagens-youth').on('postgres_changes', {event: '*', schema: 'public', table: 'mensagens'}, p => {
    if(p.eventType === 'INSERT'){ if(!chatMsgs.some(m => m.id === p.new.id)) chatMsgs.push(p.new); }
    else if(p.eventType === 'DELETE') chatMsgs = chatMsgs.filter(m => m.id !== p.old.id);
    else return;
    chatChanged();
  }).subscribe();
}

  dlgMode = 'equipe'; editing = null; adminEdit = null;
  const dlg = $('#dlg'); dlg.innerHTML = equipeHtml(true); if(!dlg.open) dlg.showModal();

  adminUsers = data || [];

function renderEquipe(){ if(dlgMode === 'equipe' && $('#dlg').open) $('#dlg').innerHTML = equipeHtml(false); }

async function createLogin(email, senha){
  // A separate client that does not store a session, so the admin stays signed in.
  const tmp = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'youth-novo-usuario'}});
  const {error} = await tmp.auth.signUp({email, password: senha});
  if(error && /already|registered|exists/i.test(error.message)) return sb.rpc('admin_definir_senha', {p_email: email, p_senha: senha});
  if(error) return {error};
  return sb.rpc('admin_confirmar_login', {p_email: email});
}
document.addEventListener('submit', async ev => {
  const f = ev.target; if(!f.classList || !f.classList.contains('uform')) return;
  ev.preventDefault();
  const isNew = f.classList.contains('unew'), email = (isNew ? f.elements.email.value : f.dataset.email).trim().toLowerCase();
  const nome = f.elements.nome.value.trim(), senha = f.elements.senha.value, papel = f.elements.papel.disabled ? 'admin' : f.elements.papel.value;
  const u = adminUsers.find(x => lower(x.email) === email);
  if(isNew && !/^\S+@\S+\.\S+$/.test(email)){ toast('Escreva um e-mail válido.'); return; }
  if((isNew || (u && !u.tem_login)) && senha.length < 6){ toast('A senha precisa ter pelo menos 6 caracteres.'); return; }
  if(senha && senha.length < 6){ toast('A senha precisa ter pelo menos 6 caracteres.'); return; }
  const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Salvando…';
  let r = await sb.rpc('admin_salvar_membro', {p_email: email, p_nome: nome, p_papel: papel});
  if(!r.error && senha) r = (isNew || (u && !u.tem_login)) ? await createLogin(email, senha) : await sb.rpc('admin_definir_senha', {p_email: email, p_senha: senha});
  if(r.error){
    btn.disabled = false; btn.textContent = isNew ? 'Criar usuário' : 'Salvar';
    toast(/signups? not allowed|disabled/i.test(r.error.message)
      ? 'O Supabase está bloqueando novos logins. Ligue "Allow new users to sign up" em Authentication.'
      : 'Não foi possível salvar: ' + r.error.message);
    return;
  }
  toast(isNew ? 'Usuário criado' : 'Alterações salvas');
  adminEdit = null; await loadAdminUsers(); await loadEquipe(); renderEquipe(); render();
});

/* ---------- Notificações no celular (push) ----------
   The device subscribes with the public VAPID key from config.js and is saved in public.push_subs;
   the Supabase function "notificar" sends the pushes (see supabase/funcao-notificar). */
let pushOn = false;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && !!(CFG && CFG.vapidPublicKey);
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const b64uToBytes = s => { const p = '='.repeat((4 - s.length % 4) % 4), raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, ch => ch.charCodeAt(0)); };
async function checkPush(){
  if(!sb || !pushSupported() || Notification.permission !== 'granted') return;
  try { const reg = await navigator.serviceWorker.ready, s = await reg.pushManager.getSubscription(); pushOn = !!s; if(s) await sb.from('push_subs').upsert({endpoint: s.endpoint, inscricao: s.toJSON()}); } catch(e){}
}
async function enablePush(){
  if(!pushSupported()){
    toast(isIOS() && !isStandalone() ? 'No iPhone, primeiro instale o app na Tela de Início (Compartilhar → Adicionar à Tela de Início) e ative por lá.' : 'Este navegador não aceita notificações.');
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ toast('As notificações estão bloqueadas. Libere nas configurações do celular para o app Youth.'); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const s = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uToBytes(CFG.vapidPublicKey)});
    const {error} = await sb.from('push_subs').upsert({endpoint: s.endpoint, inscricao: s.toJSON()});
    if(error){ toast(/relation|schema cache/i.test(error.message) ? 'Falta rodar o 8-notificacoes.sql no Supabase.' : 'Não foi possível ativar: ' + error.message); return; }
    pushOn = true; toast('Notificações ativadas neste aparelho'); renderMenu();
  } catch(e){ toast('Não foi possível ativar as notificações: ' + (e && e.message || e)); }
}
async function disablePush(){
  try { const reg = await navigator.serviceWorker.ready, s = await reg.pushManager.getSubscription(); if(s){ await sb.from('push_subs').delete().eq('endpoint', s.endpoint); await s.unsubscribe(); } } catch(e){}
  pushOn = false; toast('Notificações desligadas neste aparelho'); renderMenu();
}

  if(ev.target.id !== 'loginform') return;
  ev.preventDefault();
  const f = ev.target, msg = $('#lg-msg'), btn = f.querySelector('[type=submit]');
  btn.disabled = true; btn.textContent = 'Entrando…'; msg.textContent = '';
  const {data, error} = await sb.auth.signInWithPassword({email: f.elements.email.value.trim(), password: f.elements.senha.value});
  btn.disabled = false; btn.textContent = 'Entrar';
  if(error){ msg.textContent = /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + error.message; return; }
  f.elements.senha.value = '';
  startSupabase(data.user);
});

// In the webapp, never pretend to save: without a live Supabase session nothing may be kept only on screen.
function guardWebappSave(){
  if(!CFG || (mode === 'live' && sb)) return true;
  toast(CFG.supabaseUrl ? 'Não foi salvo: faça login de novo.' : 'Não foi salvo: este endereço do app não está ligado ao banco. Use painel-youth.vercel.app.');
  return false;
}
async function save(col, rec){
  if(!guardWebappSave()) return false;
  const id = rec.id || uid();
  const body = {...rec}; delete body.id;
  body.atualizadoEm = new Date().toISOString();
  if(mode === 'live' && sb){
    const {error} = await sb.from('registros').upsert({colecao: col, id, dados: body, atualizado_em: body.atualizadoEm});
    if(error){ toast('Não foi possível salvar: ' + error.message); return false; }
    const arr = state[col], i = arr.findIndex(x => x.id === id);
    if(i >= 0) arr[i] = {...body, id}; else arr.push({...body, id});
    render();
  } else if(mode === 'live'){
    try { await db.collection(col).doc(id).set(body); }
    catch(e){
      if(e && e.code === 'invalid_argument'){ canWrite = false; render(); toast('Você não tem permissão para editar este painel.'); }
      else if(e && e.code === 'quota_exceeded'){ toast('O painel atingiu o limite de registros. Exclua itens antigos.'); }
      else toast('Não foi possível salvar. Tente de novo.');
      return false;
    }
  } else {
    const arr = state[col]; const i = arr.findIndex(x => x.id === id);
    if(i >= 0) arr[i] = {id, ...body}; else arr.push({id, ...body});
    render();
  }
  return true;
}
async function removeRec(col, id){
  if(!guardWebappSave()) return false;
  if(mode === 'live' && sb){
    const {error} = await sb.from('registros').delete().match({colecao: col, id});
    if(error){ toast('Não foi possível excluir: ' + error.message); return false; }
    state[col] = state[col].filter(x => x.id !== id); render();
  } else if(mode === 'live'){
    try { await db.collection(col).doc(id).delete(); }
    catch(e){ toast('Não foi possível excluir. Tente de novo.'); return false; }
  } else { state[col] = state[col].filter(x => x.id !== id); render(); }
  return true;
}

/* Deadline signal: blue = on time (4+ days left), yellow = 3 days or less, red = past due. Done or undated tasks get none. */
function prazoState(t){
  if(!t.prazo || t.status === 'feito') return '';
  const n = daysUntil(t.prazo);
  return n < 0 ? 'late' : n <= 3 ? 'soon' : 'ok';
}
function prazoChip(t){
  if(!t.prazo) return '';
  const st = prazoState(t), n = daysUntil(t.prazo);
  const dia = k => k === 1 ? '1 dia' : `${k} dias`;
  const dm = t.prazo.slice(8, 10) + '/' + t.prazo.slice(5, 7);
  const txt = st === 'late' ? `Atrasada há ${dia(-n)} · ${dm}`
    : st === 'soon' ? `${n === 0 ? 'Vence hoje' : n === 1 ? 'Vence amanhã' : `Faltam ${dia(n)}`} · ${dm}`
    : st === 'ok' ? `Faltam ${dia(n)} · ${dm}` : fmtD(t.prazo);
  return `<span class="chip mono${st ? ' dl-' + st : ''}">${esc(txt)}</span>`;
}

/* Cronograma on screen, laid out like the PDF: info block, then a timed table, then songs. */
const minutes = h => { const [a, b] = String(h || '').split(':').map(Number); return isNaN(a) ? null : a * 60 + (b || 0); };
const hhmm = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
function cronogramaHtml(c){
  const od = c.ordem || [], ms = c.musicas || [];
  const info = [['Tema', c.tema], ['Preletor', c.preletor], ['Dirigente', c.dirigente], ['Ministro de louvor', c.louvor], ['Texto bíblico', c.textos], ['Série', c.serie]].filter(m => m[1]);
  const rows = od.map((o, i) => {
    const m = String(o.item || '').match(/^(.*?)\s*\((\d+)\s*min\)\s*$/i);
    const nome = m ? m[1] : o.item, dur = m ? +m[2] : null, ini = minutes(o.hora);
    const fim = ini != null && dur ? ini + dur : (od[i + 1] && minutes(od[i + 1].hora));
    return `<li class="cr-row">
      <span class="cr-time"><b>${esc(o.hora || '—')}</b>${fim != null && ini != null && fim > ini ? `<small>→ ${hhmm(fim)}</small>` : ''}</span>
      <span class="cr-what"><b>${esc(nome || '')}</b>${dur ? `<span class="cr-dur">${dur} min</span>` : ''}</span>
      <span class="cr-who">${esc(o.responsavel || '')}</span>
    </li>`;
  }).join('');
  const total = od.length && minutes(od[0].hora) != null ? (() => { const last = od[od.length - 1], lm = String(last.item).match(/\((\d+)\s*min\)/i), end = minutes(last.hora) + (lm ? +lm[1] : 0); return `${od[0].hora} às ${hhmm(end)}`; })() : '';
  return `${info.length ? `<dl class="cr-info">${info.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
    <div class="cr-sect"><h3>Cronograma</h3>${total ? `<span class="mono muted">${esc(total)}</span>` : ''}</div>
    ${od.length ? `<ol class="cr-list">${rows}</ol>` : '<p class="muted" style="margin:0">Nenhum momento cadastrado ainda.</p>'}
    ${ms.length ? `<div class="cr-sect"><h3>Músicas</h3><span class="mono muted">${ms.length}</span></div>
      <ol class="cr-songs">${ms.map((s, i) => `<li><span class="cr-n">${pad(i + 1)}</span><span class="cr-song"><b>${esc(s.titulo)}</b>${s.artista ? `<small>${esc(s.artista)}</small>` : ''}</span>${s.tom ? `<span class="chip key">Tom ${esc(s.tom)}</span>` : ''}</li>`).join('')}</ol>` : ''}
    ${c.obs ? `<div class="cr-sect"><h3>Observações</h3></div><p style="margin:0;white-space:pre-wrap">${esc(c.obs)}</p>` : ''}`;
}

function verseHtml(){
  // One verse per day of the year: 1 Jan = first verse, 31 Dec = last (29 Feb wraps to the first).
  const d = parseD(todayStr()), doy = Math.round((d - new Date(d.getFullYear(), 0, 1)) / 864e5);
  const [ref, txt] = VERSOS[doy % VERSOS.length];
  return `<section class="verse" aria-label="Versículo do dia">
    <div class="verse-top"><span class="eyebrow">Versículo do dia · ${esc(fmtD(todayStr()))}</span><span class="verse-star" aria-hidden="true">*</span></div>
    <blockquote>${esc(txt)}</blockquote>
    <cite>${esc(ref)}</cite>
  </section>`;
}

const taskSort = (a, b) => (a.prazo || '9999').localeCompare(b.prazo || '9999') || prioRank(a) - prioRank(b) || String(a.titulo).localeCompare(String(b.titulo));
function eventLabel(ref){
  if(!ref) return '';
  const [kind, id] = ref.split(':'); const it = findItem(kind, id);
  return it ? it.titulo : '';
}
function todoRow(x){
  const done = x.status === 'feito', itens = x.itens || [], ok = itens.filter(i => i.ok).length, ev = eventLabel(x.eventoRef);
  const check = canWrite
    ? `<button type="button" class="check${done ? ' on' : ''}" data-act="tcheck" data-id="${esc(x.id)}" aria-label="${done ? 'Reabrir tarefa' : 'Concluir tarefa'}">${CHECK_ICON}</button>`
    : `<span class="check${done ? ' on' : ''}" aria-hidden="true">${CHECK_ICON}</span>`;
  const st = prazoState(x);
  return `<div class="todo${done ? ' done' : ''}${st ? ' dl-' + st : ''}" data-act="topen" data-id="${esc(x.id)}">${check}

      <div class="row">${x.status === 'fazendo' ? '<span class="chip vio">Fazendo</span>' : ''}${prioChip(x.prioridade)}${prazoChip(x)}${x.responsavel ? `<span class="chip">${esc(x.responsavel)}</span>` : ''}${itens.length ? `<span class="chip mono">${ok}/${itens.length} itens</span>` : ''}${ev ? `<span class="chip">Evento: ${esc(ev)}</span>` : ''}${x.descricao ? '<span class="chip">Anotações</span>' : ''}</div>
    </div></div>`;
}
/* Tasks belong to a real user (responsavelEmail) when the webapp knows the team; the old free-text name still shows. */
const isMyTask = x => !!sbUser && ((x.responsavelEmail ? lower(x.responsavelEmail) === lower(sbUser.email) : !!x.responsavel && norm(x.responsavel) === norm(myName()))
  || (x.itens || []).some(i => !i.ok && i.resp && lower(i.resp) === lower(sbUser.email)));
function taskOwner(form, old){
  const sel = form.elements.responsavelEmail;
  if(!sel) return {responsavel: form.elements.responsavel.value.trim()};
  if(sel.value === '__keep') return {responsavel: old.responsavel || '', responsavelEmail: ''};
  const m = equipe.find(x => lower(x.email) === lower(sel.value));
  const out = {responsavelEmail: m ? m.email : '', responsavel: m ? memberName(m) : ''};
  if(lower(out.responsavelEmail) !== lower(old.responsavelEmail)){ out.atribuidoEm = out.responsavelEmail ? new Date().toISOString() : ''; out.atribuidoPor = sbUser ? sbUser.email : ''; }
  return out;
}
// Tasks someone else assigned to me, for the bell.
// Tasks someone else assigned to me, plus checklist items handed to me, for the bell.
const myAssigned = () => {
  if(!sbUser) return [];
  const me = lower(sbUser.email), out = [];
  state.tarefas.filter(x => x.status !== 'feito').forEach(x => {
    if(x.responsavelEmail && lower(x.responsavelEmail) === me && x.atribuidoPor && lower(x.atribuidoPor) !== me)
      out.push({task: x, key: 'task:' + x.id + ':' + (x.atribuidoEm || '')});
    // Items I handed to myself (I was the last to edit the task) are not "new for me".
    (x.itens || []).filter(i => !i.ok && i.resp && lower(i.resp) === me && lower(x.editadoPor) !== me)
      .forEach(i => out.push({task: x, item: i, key: 'item:' + x.id + ':' + i.id + ':' + (i.atribuidoEm || '')}));
  });
  return out;
};
function tarefasView(){
  const mode = seg.tarefas || 'abertas';
  const minhasN = state.tarefas.filter(x => x.status !== 'feito' && isMyTask(x)).length;
  const head = `<div class="bar"><h2>Tarefas</h2>${segBtns('tarefas', [['abertas','A fazer'], ...(sb ? [['minhas', `Minhas${minhasN ? ' · ' + minhasN : ''}`]] : []), ['feitas','Concluídas'], ['todas','Todas']])}</div>`;
  if(isLoading(['tarefas'])) return head + loadingBox();
  const t = todayStr(), in7 = addDays(t, 7);
  const quick = W(`<form id="tquick" class="tadd" novalidate><input id="tq-title" name="titulo" placeholder="Escreva uma nova tarefa e aperte Enter…" autocomplete="off" aria-label="Nova tarefa"><button type="submit" class="btn primary">+ Criar tarefa</button></form>`);
  const open = state.tarefas.filter(x => x.status !== 'feito' && (mode !== 'minhas' || isMyTask(x)));
  const feitas = state.tarefas.filter(x => x.status === 'feito').sort((a, b) => (b.concluidaEm || '').localeCompare(a.concluidaEm || ''));
  const group = (title, list, cls = '') => list.length ? `<section class="tgroup ${cls}"><h3>${title} <span class="mono muted">${list.length}</span></h3>${list.map(todoRow).join('')}</section>` : '';
  const openHtml = [
    group('Atrasadas', open.filter(x => x.prazo && x.prazo < t).sort(taskSort), 'late'),
    group('Hoje', open.filter(x => x.prazo === t).sort(taskSort)),
    group('Próximos 7 dias', open.filter(x => x.prazo > t && x.prazo <= in7).sort(taskSort)),
    group('Mais adiante', open.filter(x => x.prazo > in7).sort(taskSort)),
    group('Sem prazo', open.filter(x => !x.prazo).sort(taskSort))
  ].join('');
  let body = mode === 'feitas' ? group('Concluídas', feitas) : mode === 'todas' ? openHtml + group('Concluídas', feitas) : openHtml;
  if(!body) body = mode === 'feitas'
    ? empty('Nada concluído ainda', 'As tarefas que você marcar como feitas aparecem aqui.')
    : mode === 'minhas' ? empty('Nenhuma tarefa com você', 'Quando alguém atribuir uma tarefa a você, ela aparece aqui e você recebe um aviso.')
    : `<div class="empty"><strong>Tudo em dia</strong><span>Nenhuma tarefa pendente. Escreva uma tarefa no campo acima, como comprar o lanche, preparar os slides ou confirmar o preletor.</span></div>`;
  const legend = `<div class="row dl-legend" aria-label="Legenda de prazos"><span class="chip mono dl-ok">No prazo</span><span class="chip mono dl-soon">Faltam 3 dias ou menos</span><span class="chip mono dl-late">Atrasada</span></div>`;
  return head + quick + legend + body;
}

}
// A checklist item keeps a stable id, and (in the webapp) the user it was handed to.
const itemRow = (i, n) => `<div class="titem${i.ok ? ' ok' : ''}" data-id="${esc(i.id || uid())}" data-em="${esc(i.atribuidoEm || '')}"><input type="checkbox" id="ti-${n}-c" ${i.ok ? 'checked' : ''} aria-label="Item feito"${canWrite ? '' : ' disabled'}><input type="text" id="ti-${n}-t" value="${esc(i.t)}" aria-label="Item"${canWrite ? '' : ' readonly'}>${sb && equipe.length ? `<select class="ti-resp" id="ti-${n}-r" aria-label="Quem faz este item"${canWrite ? '' : ' disabled'}><option value="">Ninguém</option>${equipe.map(m => `<option value="${esc(m.email)}" ${lower(i.resp) === lower(m.email) ? 'selected' : ''}>${esc(memberName(m))}</option>`).join('')}</select>` : ''}${W(`<button type="button" class="x" data-act="titem-rm" aria-label="Remover item">×</button>`)}</div>`;

      </div>
      <aside class="tside">
        <div class="fld"><label for="t-status">Situação</label><select id="t-status" name="status"${canWrite ? '' : ' disabled'}>${STATUS.map(([v, l]) => `<option value="${v}" ${(d.status || 'afazer') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>

          : `<div class="fld"><label for="t-resp">Responsável</label><input id="t-resp" name="responsavel" list="dl-people" value="${esc(d.responsavel || '')}" placeholder="Quem cuida disso?" autocomplete="off"${canWrite ? '' : ' readonly'}><datalist id="dl-people">${people.map(p => `<option value="${esc(p)}">`).join('')}</datalist></div>`}
        <div class="fld"><label for="t-prazo-btn">Prazo</label>${dateWidget('t-prazo', 'prazo', d.prazo || '', false)}</div>
        <div class="fld"><label for="t-prio">Prioridade</label><select id="t-prio" name="prioridade"${canWrite ? '' : ' disabled'}>${PRIOS.map(p => `<option ${(d.prioridade || 'Normal') === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
        <div class="fld"><label for="t-ev">Evento ligado</label><select id="t-ev" name="eventoRef"${canWrite ? '' : ' disabled'}><option value="">Nenhum</option>${evs.map(x => { const r = x.kind + ':' + x.id; return `<option value="${esc(r)}" ${d.eventoRef === r ? 'selected' : ''}>${esc(fmtD(x.data))} · ${esc(x.titulo)}</option>`; }).join('')}</select></div>
        ${d.concluidaEm ? `<p class="muted" style="margin:0;font-size:13px">Concluída em ${esc(fmtD(d.concluidaEm.slice(0, 10)))}.</p>` : ''}
      </aside>
    </div></div>
    ${canWrite ? `<div class="df"><span>${taskCtx.id && (sb ? isAdmin : true) ? '<button type="button" class="btn danger" data-act="tdel">Excluir</button>' : ''}</span><span class="row"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Salvar tarefa</button></span></div>` : ''}
  </form>`;
  updateProg();

function updateProg(){
  const rows = [...document.querySelectorAll('#tlist .titem')], ok = rows.filter(r => r.querySelector('input[type=checkbox]').checked).length;
  const bar = $('#tprog-bar'), txt = $('#tprog-txt'); if(!bar) return;
  bar.style.width = rows.length ? Math.round(ok / rows.length * 100) + '%' : '0%';
  txt.textContent = rows.length ? `${ok} de ${rows.length}` : 'Sem itens';
  rows.forEach(r => r.classList.toggle('ok', r.querySelector('input[type=checkbox]').checked));
}
/* Checklist drives the status: all items ticked = Feito; some ticked = Fazendo. */
function syncStatusFromChecklist(){
  const boxes = [...document.querySelectorAll('#tlist .titem input[type=checkbox]')], sel = $('#t-status');
  if(!boxes.length || !sel) return;
  const done = boxes.filter(b => b.checked).length, before = sel.value;
  if(done === boxes.length) sel.value = 'feito';
  else if(done > 0 && before !== 'fazendo') sel.value = 'fazendo';
  else if(done === 0 && before === 'feito') sel.value = 'afazer';
  const big = $('#dlg .check.big'); if(big) big.classList.toggle('on', sel.value === 'feito');
  if(sel.value !== before) toast(sel.value === 'feito' ? 'Todos os itens feitos: tarefa concluída' : sel.value === 'fazendo' ? 'Tarefa em andamento' : 'Tarefa reaberta');
}
function addChecklistItem(){
  const inp = $('#t-newitem'); if(!inp || !inp.value.trim()) return;
  $('#tlist').insertAdjacentHTML('beforeend', itemRow({t: inp.value.trim(), ok: false}, 'n' + (++rowSeq)));
  inp.value = ''; inp.focus(); updateProg(); syncStatusFromChecklist();
}
function readTask(form){
  const old = taskCtx.id ? (state.tarefas.find(x => x.id === taskCtx.id) || {}) : {};
  const rec = {...old, id: taskCtx.id || uid(),
    titulo: form.elements.titulo.value.trim(), descricao: form.elements.descricao.value.trim(),
    status: form.elements.status.value, ...taskOwner(form, old),
    prazo: form.elements.prazo.value, prioridade: form.elements.prioridade.value, eventoRef: form.elements.eventoRef.value,
    itens: [...form.querySelectorAll('#tlist .titem')].map(r => {
      const sel = r.querySelector('.ti-resp'), resp = sel ? sel.value : '';
      const antes = (old.itens || []).find(x => x.id === r.dataset.id) || {};
      // A new assignee gets a fresh timestamp, which is what the bell and the push use to spot "new for you".
      const atribuidoEm = resp && lower(resp) !== lower(antes.resp) ? new Date().toISOString() : (resp ? (antes.atribuidoEm || r.dataset.em || '') : '');
      return {id: r.dataset.id, t: r.querySelector('input[type=text]').value.trim(), ok: r.querySelector('input[type=checkbox]').checked, resp, atribuidoEm};
    }).filter(i => i.t)};
  const pending = $('#t-newitem') && $('#t-newitem').value.trim(); if(pending) rec.itens.push({id: uid(), t: pending, ok: false, resp: '', atribuidoEm: ''});
  // With a checklist, the checklist decides: all items done = Feito; otherwise it cannot be Feito.
  if(rec.itens.length && rec.itens.every(i => i.ok)) rec.status = 'feito';
  else if(rec.itens.length && rec.status === 'feito') rec.status = 'fazendo';
  if(sbUser) rec.editadoPor = sbUser.email;
  rec.concluidaEm = rec.status === 'feito' ? (old.status === 'feito' && old.concluidaEm ? old.concluidaEm : new Date().toISOString()) : '';
  if(!taskCtx.id) rec.criadoEm = new Date().toISOString();
  return rec;
}
async function toggleTask(id){
  const r = state.tarefas.find(x => x.id === id); if(!r) return;
  if((r.itens || []).length){ toast('Esta tarefa tem checklist: ela é concluída sozinha quando todos os itens forem marcados.'); openTask(id); return; }
  const feito = r.status !== 'feito';
  if(await save('tarefas', {...r, status: feito ? 'feito' : 'afazer', concluidaEm: feito ? new Date().toISOString() : '', editadoPor: sbUser ? sbUser.email : ''})) toast(feito ? 'Tarefa concluída' : 'Tarefa reaberta');
}
document.addEventListener('submit', async ev => {
  if(ev.target.id === 'tquick'){
    ev.preventDefault();
    const titulo = ev.target.elements.titulo.value.trim();
    if(!titulo){ openTask(null, {status: 'afazer', prioridade: 'Normal', itens: []}); return; }
    const rec = {id: uid(), titulo, status: 'afazer', prioridade: 'Normal', itens: [], criadoEm: new Date().toISOString()};
    if(await save('tarefas', rec)){ toast('Tarefa criada'); const f = $('#tq-title'); if(f){ f.value = ''; f.focus(); } }
  } else if(ev.target.id === 'tform'){
    ev.preventDefault();
    const form = ev.target;
    if(!form.elements.titulo.value.trim()){ toast('Dê um nome para a tarefa.'); form.elements.titulo.focus(); return; }
    const btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Salvando…';
    if(await save('tarefas', readTask(form))){ toast('Tarefa salva'); $('#dlg').close(); }
    else { btn.disabled = false; btn.textContent = 'Salvar tarefa'; }
  }
});
document.addEventListener('keydown', ev => { if(ev.target.id === 't-newitem' && ev.key === 'Enter'){ ev.preventDefault(); addChecklistItem(); } });
document.addEventListener('change', ev => {
  if(ev.target.closest && ev.target.closest('#tlist')){
    updateProg();
    if(ev.target.type === 'checkbox'){
      syncStatusFromChecklist();
      // Ticking an item of a saved task is kept right away, so the task moves to Concluídas on its own.
      if(taskCtx && taskCtx.id && canWrite && $('#tform')) save('tarefas', readTask($('#tform'))).then(ok => { if(ok){ const t = state.tarefas.find(x => x.id === taskCtx.id); if(t && t.status === 'feito'){ toast('Checklist completo: tarefa concluída'); $('#dlg').close(); } } });
    }
  }
  if(ev.target.id === 't-status'){ const c = $('#dlg .check.big'); if(c) c.classList.toggle('on', ev.target.value === 'feito'); }
});

/* ---------- Arquivos ----------
   Files live in the Supabase Storage bucket "arquivos" (webapp only); each file also has a row in
   the "arquivos" collection with its name, folder, size and storage path. */
const PASTAS = [
  ['manuais', 'Manuais', '#FE003E'],
  ['orcamentos', 'Modelos de orçamento', '#FFD004'],
  ['workbooks', 'Workbooks', '#5A11E7'],
  ['diversos', 'Diversos', '#878787']
];
const FOLDER_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6l2.2 2.2h7.2A2.5 2.5 0 0 1 21 8.7v8.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>';
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function fileKind(nome){
  const ext = (String(nome).split('.').pop() || '').toLowerCase();
  if(ext === 'pdf') return ['PDF', '#E10031'];
  if(['doc','docx','odt','rtf','txt','pages'].includes(ext)) return ['DOC', '#1E5EFF'];
  if(['xls','xlsx','csv','ods','numbers'].includes(ext)) return ['XLS', '#12804F'];
  if(['ppt','pptx','key','odp'].includes(ext)) return ['PPT', '#E8590C'];
  if(['jpg','jpeg','png','gif','webp','heic','svg'].includes(ext)) return ['IMG', '#5A11E7'];
  if(['mp3','wav','m4a','mp4','mov'].includes(ext)) return ['MÍDIA', '#0B0B0C'];
  if(['zip','rar','7z'].includes(ext)) return ['ZIP', '#5E5A55'];
  return [(ext || 'ARQ').slice(0, 4).toUpperCase(), '#5E5A55'];
}
function arquivosView(){
  const head = `<div class="bar"><h2>Arquivos</h2></div>`;
  if(!sb) return head + `<div class="empty"><strong>Disponível no app</strong><span>Os arquivos da equipe ficam guardados no webapp. Abra <b>painel-youth.vercel.app</b> para ver, enviar e baixar.</span></div>`;

      return `<button type="button" class="folder" data-act="pasta" data-pasta="${k}" style="--fc:${cor}">
        <span class="folder-ico">${FOLDER_ICON}</span>
        <span class="folder-name">${esc(nome)}</span>
        <span class="folder-meta mono">${fs.length ? `${fs.length} arquivo${fs.length > 1 ? 's' : ''} · ${fmtSize(total)}` : 'Vazia'}</span>
      </button>`;
    }).join('')}</div>`;
  }
  const [k, nome, cor] = PASTAS.find(p => p[0] === pastaAberta) || PASTAS[3];
  const list = files.filter(f => f.pasta === k).sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt'));
  return `<div class="bar"><div class="crumbs"><button type="button" class="btn ghost" data-act="pasta" data-pasta="">‹ Arquivos</button><h2 style="--fc:${cor}"><span class="crumb-dot"></span>${esc(nome)}</h2></div>
    ${A(`<label class="btn primary upl" for="upl-input">+ Enviar arquivos</label><input type="file" id="upl-input" multiple hidden>`)}</div>
    ${list.length ? `<div class="files">${list.map(f => {
      const [tag, tc] = fileKind(f.nome);
      return `<div class="file">
        <span class="ftag" style="background:${tc}">${esc(tag)}</span>
        <div class="fbody"><b class="fname">${esc(f.nome)}</b><span class="muted mono">${fmtSize(f.tamanho || 0)} · ${esc(fmtD((f.criadoEm || '').slice(0, 10)))}${f.enviadoPor ? ' · ' + esc(f.enviadoPor) : ''}</span></div>
        <div class="factions">
          <button type="button" class="btn" data-act="fopen" data-id="${esc(f.id)}">Abrir</button>
          <button type="button" class="btn ghost" data-act="fdown" data-id="${esc(f.id)}">Baixar</button>
          ${A(`<button type="button" class="btn ghost danger-txt" data-act="fdel" data-id="${esc(f.id)}" aria-label="Excluir ${esc(f.nome)}">Excluir</button>`)}
        </div>
      </div>`;
    }).join('')}</div>`
    : `<div class="empty"><strong>Pasta vazia</strong><span>${isAdmin ? 'Envie PDFs, planilhas, documentos ou imagens. Cada arquivo pode ter até 50 MB.' : 'Nenhum arquivo nesta pasta ainda. Só o administrador do painel envia arquivos.'}</span></div>`}`;
}
const safeName = n => String(n).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/-+/g, '-').slice(-120);
async function uploadFiles(fileList){
  const files = [...fileList]; if(!files.length || !sb) return;
  let ok = 0;

    if(up.error){ toast('Não foi possível enviar: ' + up.error.message); continue; }

/* ---------- Adicionar ao meu calendário ---------- */
function eventoDatas(it){
  const desc = String((it.rec && it.rec.descricao) || '');
  const ini = it.hora || '';
  const fimTxt = (desc.match(/às\s*(\d{1,2})(?:[:h](\d{2}))?/i) || []);
  const fim = fimTxt[1] ? pad(+fimTxt[1]) + ':' + (fimTxt[2] || '00') : '';
  return {ini, fim};
}
function calStamp(data, hora){ return data.replace(/-/g, '') + (hora ? 'T' + hora.replace(':', '') + '00' : ''); }
function addToCalendar(it, tipo){
  const {ini, fim} = eventoDatas(it);
  const dia = it.data, nextDay = addDays(dia, 1);
  let start, end;
  if(ini){ start = calStamp(dia, ini); const e = fim && fim > ini ? fim : hhmm(minutes(ini) + 120); end = calStamp(dia, e); }
  else { start = calStamp(dia, ''); end = calStamp(nextDay, ''); }
  const titulo = it.titulo || 'Evento Youth', local = it.local || '', detalhes = [it.tipo, (it.rec && it.rec.descricao) || ''].filter(Boolean).join('\n');
  if(tipo === 'google'){
    const u = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(titulo) + '&dates=' + start + '/' + end + '&ctz=America/Sao_Paulo' + (local ? '&location=' + encodeURIComponent(local) : '') + '&details=' + encodeURIComponent(detalhes);
    openUrl(u, false); return;
  }
  const escIcs = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Painel Youth//PT-BR', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    'UID:' + it.kind + '-' + it.id + '@painel-youth', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''),
    ini ? 'DTSTART;TZID=America/Sao_Paulo:' + start : 'DTSTART;VALUE=DATE:' + start,
    ini ? 'DTEND;TZID=America/Sao_Paulo:' + end : 'DTEND;VALUE=DATE:' + end,
    'SUMMARY:' + escIcs(titulo), local ? 'LOCATION:' + escIcs(local) : '', detalhes ? 'DESCRIPTION:' + escIcs(detalhes) : '',
    'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:' + escIcs(titulo), 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
  saveFile((titulo.replace(/[\\/:*?"<>|]/g, '').slice(0, 60) || 'evento') + '.ics', new Blob([ics], {type: 'text/calendar'}));
}
