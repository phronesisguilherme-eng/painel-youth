<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF9F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Youth">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body><title>Painel Youth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: Youth Worship manual look — black cover band with logo and the pink/yellow/violet/grey stripe,
   paper pages with grey rounded panels, condensed uppercase headlines, sticker shadows in brand pink. */
:root{
  --bg:#FBF9F4; --surface:#FFFDF8; --card:#F1EFEA; --ink:#0B0B0C; --muted:#5E5A55; --line:#E2DED6;
  --accent:#E8003F; --accent-ink:#FFFFFF; --soft:#FDE3EA; --sun:#FFD004; --sun-ink:#1A1400; --violet:#5A11E7;
  --tile-bg:#0B0B0C; --tile-ink:#FBF9F4;
  --head-bg:#FBF9F4; --head-ink:#0B0B0C; --head-muted:#5E5A55;
  --ok:#12804F; --warn:#A35F00; --bad:#C8102E; --shadow:0 1px 2px rgba(11,11,12,.06),0 8px 24px rgba(11,11,12,.08);
  --f-display:"Anton",Impact,"Arial Narrow",sans-serif;
  --f-body:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Courier Prime","Courier New",ui-monospace,monospace;
  --f-hand:"Permanent Marker","Comic Sans MS",cursive;
}
/* Single paper look on purpose: the manual's off-white pages, in light and dark system themes alike. */
:root{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:10px}
.mark h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.mark h1 i{font-style:normal;background:var(--sun);color:var(--sun-ink);padding:0 6px;border-radius:4px;margin-left:2px}
.mark span{color:var(--muted);font-size:13px}
#status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--ok)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:24px 64px}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.banner b{font-weight:700}

/* Toolbar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar h2{font-size:26px;font-weight:800;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn.danger{color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Cards & tiles */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.stack{display:grid;gap:12px}
.tile{flex:none;width:58px;border-radius:10px;background:var(--ink);color:var(--bg);text-align:center;padding:6px 0 7px;font-family:var(--f-mono);line-height:1.1}
.tile span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.tile b{display:block;font-size:24px;font-weight:700;margin:2px 0}
.tile.past{background:var(--line);color:var(--muted)}
.item{display:flex;gap:14px;align-items:flex-start}
.item .body{flex:1;min-width:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.key{font-family:var(--f-mono);background:var(--sun);color:var(--sun-ink)}
.chip.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin-top:12px}
.meta div{min-width:0}
.meta dt{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.meta dd{margin:0;font-weight:600;overflow-wrap:anywhere}
details{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.order{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:0}
.order li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.order li:last-child{border-bottom:0}
.songs{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.songs li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.songs .n{font-family:var(--f-mono);color:var(--muted);font-size:12px;width:20px}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.next{border:2px solid var(--ink);box-shadow:var(--shadow)}
.next h3{font-size:30px;font-weight:800;letter-spacing:-.015em;margin-top:4px}
.count{font-family:var(--f-mono);font-size:13px;background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:2px 8px;font-weight:700}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.sect-h h3{font-size:18px;font-weight:700}
.list{display:grid;gap:0}
.list > div{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;justify-content:space-between;min-width:0}
.list > div:last-child{border-bottom:0}
.list .t{min-width:0;overflow-wrap:anywhere}

/* Agenda */
.month{font-family:var(--f-display);font-size:18px;font-weight:700;margin:22px 0 10px}
.month:first-child{margin-top:0}

/* Escalas */
.roles{display:grid;gap:6px;margin-top:8px}
.role{display:grid;grid-template-columns:190px 1fr auto;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.role:last-child{border-bottom:0}
.role b{font-size:13px}

/* Tarefas */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.col h3{font-size:15px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:10px}
.task{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);display:grid;gap:6px}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:600;overflow-wrap:anywhere}
.task .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}

/* Avisos */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
.note p{white-space:pre-wrap;margin:8px 0 0;overflow-wrap:anywhere}
.note.pinned{border-color:var(--sun);border-width:2px}

/* Repertório */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.empty{border:1.5px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:18px}

/* Dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,24,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:20px;font-weight:800}
.db{padding:18px 20px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.df{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:grid;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg)}
.fld textarea{min-height:84px;resize:vertical}
.fld.check{display:flex;align-items:center;gap:8px}
.fld.check input{width:auto}
.rep{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.rep-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rep-h b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rrow{display:grid;gap:6px;align-items:center}
.rrow.m{grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 70px 32px}
.rrow.o{grid-template-columns:142px minmax(0,2fr) minmax(0,1.4fr) 32px}
.rrow input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--bg);min-width:0}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px}
.x:hover{color:var(--bad)}

.steps{display:flex;gap:4px;overflow-x:auto;padding:10px 20px 0;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{border:0;background:none;padding:8px 10px 10px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:14px}
.steps button span{font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line)}
.steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent)}
.steps button[aria-current="step"] span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.db[data-panel]{flex:1;align-content:start;min-height:300px}
.hint-step{grid-column:1/-1;margin:0;color:var(--muted);font-size:14px}
#resumo{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;background:var(--bg)}
#resumo h3{font-size:20px;font-weight:800}
#resumo .warn{color:var(--warn);font-size:14px;font-weight:600}
.dwrap{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dwrap .dh h2{font-size:21px}
.dbody{padding:18px 20px 22px;overflow-y:auto;min-height:280px}
.agenda-item{cursor:pointer}
.agenda-item:hover{border-color:var(--muted)}
.linkish{border:0;background:none;padding:0;font:inherit;font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.linkish:hover{color:var(--accent)}
.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg);font-size:14px;flex:none}
.editbar.open{display:grid;gap:12px;max-height:55vh;overflow-y:auto;padding-block:16px}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qgrid .fld.full{grid-column:1/-1}
.qgrid .fld input,.qgrid .fld select,.qgrid .fld textarea{background:var(--surface)}
@media (max-width:560px){.qgrid{grid-template-columns:1fr 1fr}}
.hright{display:flex;align-items:center;gap:12px}
.bellwrap{position:relative}
.bellbtn{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.bellbtn:hover{border-color:var(--muted)}
#bellcount{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font:700 11px/18px var(--f-mono);border-radius:999px;min-width:18px;height:18px;padding:0 5px;text-align:center}
#bellpop{position:absolute;right:0;top:46px;width:min(340px,calc(100vw - 32px));max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:14px;z-index:30;display:grid;gap:10px}
.fld select#me-sel{background:var(--bg)}
.notif{display:grid;gap:3px;text-align:left;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg);cursor:pointer;width:100%}
.notif.unread{border-color:var(--accent);border-width:2px}
.notif:hover{border-color:var(--muted)}
.mlist{display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface);box-shadow:var(--shadow)}
.mlist button{text-align:left;border:0;background:none;padding:7px 9px;border-radius:6px;cursor:pointer;font-weight:600}
.mlist button:hover,.mlist button:focus-visible{background:var(--soft)}
.mention{color:var(--accent);font-weight:700}
/* ---- Youth Worship brand layer ---- */
h3{font-family:var(--f-body)}
body::before{background:var(--head-bg)}
header.top{background:var(--head-bg);color:var(--head-ink);border-bottom:0}
.brand{padding-block:14px 8px}
.mark{align-items:center;gap:14px}
.mark .logo{height:42px;width:auto;display:block}
.mark .tag{font-family:var(--f-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--head-muted);line-height:1.3;max-width:150px}
.hand{font-family:var(--f-hand);color:var(--violet);font-size:15px;line-height:1.25;margin:0;transform:rotate(-2deg);max-width:300px}
@media (max-width:900px){.hand{display:none}}
#status{color:var(--head-muted);font-family:var(--f-mono);font-size:12px}
.tabs button{color:var(--head-muted);font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.05em;text-transform:uppercase;padding:10px 14px 9px}
.tabs button:hover{color:var(--head-ink)}
.tabs button[aria-current="page"]{color:var(--head-ink);border-bottom-color:var(--accent)}
.stripes{display:grid;grid-template-columns:4fr 3fr 2fr 1fr;height:6px}
.stripes i:nth-child(1){background:#FE003E}
.stripes i:nth-child(2){background:#FFD004}
.stripes i:nth-child(3){background:#5A11E7}
.stripes i:nth-child(4){background:#878787}
.bellbtn{background:var(--surface);border:2px solid var(--ink);color:var(--ink)}
.bellbtn:hover{border-color:var(--accent);color:var(--accent)}
#bellcount{background:#FE003E}
#bellpop{color:var(--ink);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--accent)}

.bar h2{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,6vw,56px);text-transform:uppercase;letter-spacing:.01em;line-height:.95;position:relative;padding-bottom:14px}
.bar h2::after{content:"";position:absolute;left:0;bottom:0;width:min(100%,240px);height:7px;border-radius:7px;background:var(--ink);transform:rotate(-1.2deg)}
.bar h2 em{font-style:normal;color:var(--accent)}
.card,.col,.tablewrap{background:var(--card);border:0;border-radius:18px}
.task{background:var(--surface);border-color:transparent;border-radius:12px}
.col h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:22px;letter-spacing:.02em}
.next{background:var(--surface);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--accent)}
.next h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:44px;line-height:1;letter-spacing:.01em}
.sect-h h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:24px;letter-spacing:.02em}
.month{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:30px;color:var(--accent);letter-spacing:.02em}
.tile{background:var(--tile-bg);color:var(--tile-ink);border-radius:12px;width:62px;padding:7px 0 8px}
.tile b{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1;margin:3px 0}
.tile span{font-weight:700;opacity:.85}
.tile.past{background:var(--line);color:var(--muted)}
.eyebrow,.meta dt,.fld label,th{font-family:var(--f-mono);letter-spacing:.05em}
.btn{border-radius:999px;border:2px solid var(--ink);background:transparent;font-weight:600}
.btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:none;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.btn.ghost:hover{background:var(--soft);color:var(--ink);border-color:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.seg{background:var(--card);border:0}
.seg button{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{font-family:var(--f-mono);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;padding:3px 10px}
.chip.key{background:var(--sun);color:var(--sun-ink)}
.linkish{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:28px;letter-spacing:.01em;line-height:1.05}
.linkish:hover{color:var(--accent)}
.agenda-item{transition:box-shadow .15s, transform .15s}
.agenda-item:hover{box-shadow:6px 6px 0 var(--accent);transform:translate(-2px,-2px)}
@media (prefers-reduced-motion:reduce){.agenda-item{transition:none}.agenda-item:hover{transform:none}}
.empty{border:2px dashed var(--line);background:transparent;border-radius:18px}

.editbar{background:var(--card)}
.order li span.mono{color:var(--accent);font-weight:700}
.mention{color:var(--violet)}
.songs .n{color:var(--accent);font-weight:700}

/* Task rows inside grey panels (Início, event Informações): white base so undated tasks still stand out. */

.todo .tbody .row{gap:5px}

/* Chat */

#chatfab:focus-visible{outline:2px solid #0B0B0C;outline-offset:4px;border-radius:50%}

#chatfab .cbadge{position:absolute;top:-2px;right:-4px}

.cbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#0B0B0C;color:#fff;font:700 11px/1 var(--f-mono);border:2px solid #FFFFFF}

#chatwrap{display:flex;flex-direction:column;height:100%;background:var(--card)}
.chat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.chat-head > div{display:grid;gap:2px;min-width:0}
.chat-x{font-size:26px;padding:2px 6px;margin:-4px -4px 0 0}
.chat-head h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:26px;letter-spacing:.01em}
.chat-as{font-size:13px}
.chat-as input{border:1px solid var(--ink);border-radius:6px;padding:3px 8px;background:var(--bg);width:150px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
#chatlist{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.chat-empty{margin:auto;text-align:center;display:grid;gap:4px;padding:20px}

.cday{display:flex;justify-content:center;margin:12px 0 6px}
.cday span{font-family:var(--f-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.bubble{max-width:min(78%,520px);background:var(--surface);border-radius:16px 16px 16px 4px;padding:8px 12px 6px;display:grid;gap:2px;box-shadow:0 1px 1px rgba(0,0,0,.05)}

.chat-compose textarea{flex:1;min-width:0;resize:none;border:2px solid var(--ink);border-radius:20px;padding:9px 14px;background:var(--bg);font:inherit;line-height:1.35;max-height:140px}

.chat-send{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer}

@media (max-width:640px){

}

/* Cronograma (event window) */
.cr-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0;background:var(--card);border-radius:14px;padding:14px 16px}

@media (max-width:640px){
  .cr-info{grid-template-columns:1fr 1fr;padding:12px 14px;gap:10px 14px}

  .editbar:not(.open){padding:8px 16px;justify-content:flex-end}

}

#login{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-left,0px))}

.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:transparent;padding:0;margin-top:1px}

.verse cite{justify-self:start;font-style:normal;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:18px;background:#0B0B0C;color:#FFFFFF;padding:5px 14px 4px;border-radius:4px;transform:rotate(-1.5deg)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const COLS = ['cultos','eventos','escalas','tarefas','avisos','arquivos'];
const state = {cultos:[],eventos:[],escalas:[],tarefas:[],avisos:[],arquivos:[]};
const loaded = {};
let db = null, mode = 'loading', canWrite = true;
const TABS = ['inicio','agenda','tarefas','avisos','arquivos'];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : (()=>{try{return localStorage.getItem('youth-tab')||'inicio'}catch(e){return 'inicio'}})();
if(!TABS.includes(tab)) tab='inicio';
const seg = {agenda:'proximos', tarefas:'abertas'};
let pastaAberta = null; // folder open in the Arquivos tab

const areaRank = a => { const i = AREAS.indexOf(a); return i < 0 ? 98 : i; };
const AREAS = ['Louvor','Recepção','Mídia / Projeção','Som','Fotografia','Intercessão','Ceia','Limpeza / Lanche','Outros'];
const TIPOS = ['Evento Awake','Evento Storm','Youth Hangout','Treinamento','Culto especial','Retiro','Acampamento','Reunião de equipe','Evangelismo','Social / Comunhão','Ensaio','Outro'];
const STATUS = [['afazer','A fazer'],['fazendo','Fazendo'],['feito','Feito']];
const PRIOS = ['Normal','Alta','Baixa'];
// [início, momento, quem conduz: dir = dirigente, lv = ministro de louvor, pre = preletor]
const ORDEM_PADRAO = [
  ['19:30','Oração inicial (10 min)','dir'],
  ['19:40','Abertura + Louvor (30 min)','lv'],
  ['20:10','Ministração (5 min)','dir'],
  ['20:15','Avisos + Visitantes (5 min)','dir'],
  ['20:20','Louvor oferta (5 min)','lv'],
  ['20:25','Palavra (40 min)','pre'],
  ['21:05','Música final (5 min)','lv']
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const parseD = s => { const [y,m,d] = (s||'').split('-').map(Number); return new Date(y||1970,(m||1)-1,d||1); };
const WD = ['dom','seg','ter','qua','qui','sex','sáb'];
const MO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WDF = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MOF = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const fmtD = s => { if(!s) return 'Sem data'; const d = parseD(s); return `${WD[d.getDay()]}, ${pad(d.getDate())} ${MO[d.getMonth()]}`; };
const daysUntil = s => Math.round((parseD(s) - parseD(todayStr())) / 864e5);
const rel = s => { if(!s) return ''; const n = daysUntil(s); if(n===0) return 'hoje'; if(n===1) return 'amanhã'; if(n===-1) return 'ontem'; return n>1 ? `em ${n} dias` : `há ${-n} dias`; };
const tile = (s, past) => { if(!s) return `<div class="tile${past?' past':''}"><span>—</span><b>?</b><span></span></div>`; const d = parseD(s); return `<div class="tile${past?' past':''}" aria-label="${esc(fmtD(s))}"><span>${MO[d.getMonth()]}</span><b>${d.getDate()}</b><span>${WD[d.getDay()]}</span></div>`; };
const byDate = (arr, dir=1) => [...arr].sort((a,b) => dir * (((a.data||'9999')+(a.hora||'')).localeCompare((b.data||'9999')+(b.hora||''))));
const W = html => canWrite ? html : '';

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=> t.hidden = true, 2600); }

/* ---------- Data ----------
   Two backends: the claude.ai artifact store (when opened as an Artifact) and Supabase (the
   standalone webapp, which loads config.js with window.YOUTH_CONFIG and supabase-js before this script). */
const CFG = window.YOUTH_CONFIG || null;
let sb = null, sbUser = null, isAdmin = false; // isAdmin: only the admin uploads or deletes files
const A = html => (canWrite && isAdmin) ? html : '';
async function init(){
  render();
  if(CFG && CFG.supabaseUrl) return initSupabase();
  const c = window.claude;
  if(!c || typeof c.use !== 'function'){ mode = 'local'; render(); return; }
  try { db = await c.use('db'); } catch(e){ db = null; }
  if(!db){ mode = 'local'; render(); return; }
  try {
    const user = await c.use('user');
    const w = user ? await user.can('data.write') : null;
    if(w === false) canWrite = false;
  } catch(e){}
  mode = 'live';
  COLS.forEach(name => {
    db.collection(name).onSnapshot(snap => {
      state[name] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      loaded[name] = true;
      render();
    }, () => toast('A sincronização parou. Recarregue a página.'));
  });
  render();
}

async function initSupabase(){
  if(!window.supabase || !CFG.supabaseAnonKey){ mode = 'local'; render(); toast('Configuração do banco incompleta. Confira o arquivo config.js.'); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {persistSession: true, autoRefreshToken: true}});
  const {data} = await sb.auth.getSession();
  if(data && data.session) return startSupabase(data.session.user);
  $('#login').hidden = false; setTimeout(() => { const f = $('#lg-email'); if(f) f.focus(); }, 0);
}
async function startSupabase(user){
  sbUser = user; $('#login').hidden = true;
  mode = 'live'; canWrite = true; render();
  const me = await sb.from('membros').select('papel').maybeSingle();
  isAdmin = !!(me.data && me.data.papel === 'admin');
  const {data, error} = await sb.from('registros').select('colecao,id,dados').limit(10000);
  if(error){ toast('Sem acesso aos dados: ' + error.message); canWrite = false; COLS.forEach(c => loaded[c] = true); render(); return; }
  COLS.forEach(c => { state[c] = []; loaded[c] = true; });
  (data || []).forEach(r => { if(state[r.colecao]) state[r.colecao].push({...r.dados, id: r.id}); });
  render();
  sb.channel('registros-youth').on('postgres_changes', {event: '*', schema: 'public', table: 'registros'}, p => {
    const r = p.eventType === 'DELETE' ? p.old : p.new; if(!r || !state[r.colecao]) return;
    if(p.eventType === 'DELETE') state[r.colecao] = state[r.colecao].filter(x => x.id !== r.id);
    else { const rec = {...r.dados, id: r.id}, arr = state[r.colecao], i = arr.findIndex(x => x.id === rec.id); if(i >= 0) arr[i] = rec; else arr.push(rec); }
    render();
  }).subscribe();
  loadChat();
  sb.channel('mensagens-youth').on('postgres_changes', {event: '*', schema: 'public', table: 'mensagens'}, p => {
    if(p.eventType === 'INSERT'){ if(!chatMsgs.some(m => m.id === p.new.id)) chatMsgs.push(p.new); }
    else if(p.eventType === 'DELETE') chatMsgs = chatMsgs.filter(m => m.id !== p.old.id);
    else return;
    chatChanged();
  }).subscribe();
}
document.addEventListener('submit', async ev => {
  if(ev.target.id !== 'passform') return;
  ev.preventDefault();
  const f = ev.target, msg = $('#pw-msg'), a = f.elements.pw1.value, b = f.elements.pw2.value;
  if(a.length < 6){ msg.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
  if(a !== b){ msg.textContent = 'As duas senhas não são iguais.'; return; }
  const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Salvando…';
  const {error} = await sb.auth.updateUser({password: a});
  btn.disabled = false; btn.textContent = 'Salvar nova senha';
  if(error){ msg.textContent = /different|same/i.test(error.message) ? 'A nova senha precisa ser diferente da atual.' : /weak|short/i.test(error.message) ? 'Senha fraca: use pelo menos 6 caracteres, misturando letras e números.' : 'Não foi possível trocar: ' + error.message; return; }
  $('#dlg').close(); toast('Senha trocada. Use a nova senha no próximo login.');
});
document.addEventListener('submit', async ev => {
  if(ev.target.id !== 'loginform') return;
  ev.preventDefault();
  const f = ev.target, msg = $('#lg-msg'), btn = f.querySelector('[type=submit]');
  btn.disabled = true; btn.textContent = 'Entrando…'; msg.textContent = '';
  const {data, error} = await sb.auth.signInWithPassword({email: f.elements.email.value.trim(), password: f.elements.senha.value});
  btn.disabled = false; btn.textContent = 'Entrar';
  if(error){ msg.textContent = /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + error.message; return; }
  f.elements.senha.value = '';
  startSupabase(data.user);
});

async function save(col, rec){
  const id = rec.id || uid();
  const body = {...rec}; delete body.id;
  body.atualizadoEm = new Date().toISOString();
  if(mode === 'live' && sb){
    const {error} = await sb.from('registros').upsert({colecao: col, id, dados: body, atualizado_em: body.atualizadoEm});
    if(error){ toast('Não foi possível salvar: ' + error.message); return false; }
    const arr = state[col], i = arr.findIndex(x => x.id === id);
    if(i >= 0) arr[i] = {...body, id}; else arr.push({...body, id});
    render();
  } else if(mode === 'live'){
    try { await db.collection(col).doc(id).set(body); }
    catch(e){
      if(e && e.code === 'invalid_argument'){ canWrite = false; render(); toast('Você não tem permissão para editar este painel.'); }
      else if(e && e.code === 'quota_exceeded'){ toast('O painel atingiu o limite de registros. Exclua itens antigos.'); }
      else toast('Não foi possível salvar. Tente de novo.');
      return false;
    }
  } else {
    const arr = state[col]; const i = arr.findIndex(x => x.id === id);
    if(i >= 0) arr[i] = {id, ...body}; else arr.push({id, ...body});
    render();
  }
  return true;
}
async function removeRec(col, id){
  if(mode === 'live' && sb){
    const {error} = await sb.from('registros').delete().match({colecao: col, id});
    if(error){ toast('Não foi possível excluir: ' + error.message); return false; }
    state[col] = state[col].filter(x => x.id !== id); render();
  } else if(mode === 'live'){
    try { await db.collection(col).doc(id).delete(); }
    catch(e){ toast('Não foi possível excluir. Tente de novo.'); return false; }
  } else { state[col] = state[col].filter(x => x.id !== id); render(); }
  return true;
}

/* ---------- Render ---------- */
function render(){
  const st = $('#status');
  if(mode === 'loading') st.innerHTML = '<span class="dot"></span> <span class="st-txt">Conectando…</span>';
  else if(mode === 'local') st.innerHTML = '<span class="dot"></span> <span class="st-txt">Modo de teste</span>';
  else if(sb) st.innerHTML = `<span class="dot live"></span> <span class="st-txt">${esc(sbUser && sbUser.email || 'Conectado')}</span> <button type="button" class="btn ghost" data-act="senha" style="padding:2px 6px;font-size:12px">Senha</button> <button type="button" class="btn ghost" data-act="logout" style="padding:2px 6px;font-size:12px">Sair</button>`;
  else st.innerHTML = `<span class="dot live"></span> <span class="st-txt">${canWrite ? 'Sincronizado com a equipe' : 'Somente leitura'}</span>`;

  const bn = $('#banner');
  if(mode === 'local' && CFG) bn.innerHTML = '<div class="banner"><b>Banco não configurado.</b> Preencha o arquivo config.js com o endereço e a chave do Supabase.</div>';
  else if(mode === 'local') bn.innerHTML = '<div class="banner"><b>Modo de teste.</b> O que você cadastrar aqui fica só nesta tela e some ao recarregar. Abra pelo link do claude.ai, conectado à sua conta, para salvar para toda a equipe.</div>';
  else if(mode === 'live' && !canWrite) bn.innerHTML = '<div class="banner"><b>Somente leitura.</b> Você pode ver tudo, mas não editar. Peça ao pastor acesso de edição ao painel.</div>';
  else bn.innerHTML = '';

  document.querySelectorAll('.tabs button, #bnav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  $('#view').innerHTML = VIEWS[tab]();
  if(chatOpen) renderChatList();   // the floating chat keeps its composer; only the message list refreshes
  updateChatFab();
  if(dlgMode === 'detail' && $('#dlg').open && !detailCtx.editOpen && !detailCtx.obsDirty) renderDetail();
  renderBell();
}

const segBtns = (key, opts) => `<div class="seg" role="group">${opts.map(([v,l]) => `<button data-act="seg" data-key="${key}" data-val="${v}" aria-pressed="${seg[key]===v}">${l}</button>`).join('')}</div>`;
const empty = (title, text, col, label) => `<div class="empty"><strong>${title}</strong><span>${text}</span>${col ? W(`<button class="btn primary" data-act="new" data-col="${col}">${label}</button>`) : ''}</div>`;
const isLoading = cols => mode === 'loading' || (mode === 'live' && cols.some(c => !loaded[c]));
const loadingBox = () => '<div class="empty"><span>Carregando dados da equipe…</span></div>';

function prioChip(p){ return p === 'Alta' ? '<span class="chip bad">Alta</span>' : p === 'Baixa' ? '<span class="chip">Baixa</span>' : ''; }
/* Deadline signal: blue = on time (4+ days left), yellow = 3 days or less, red = past due. Done or undated tasks get none. */
function prazoState(t){
  if(!t.prazo || t.status === 'feito') return '';
  const n = daysUntil(t.prazo);
  return n < 0 ? 'late' : n <= 3 ? 'soon' : 'ok';
}
function prazoChip(t){
  if(!t.prazo) return '';
  const st = prazoState(t), n = daysUntil(t.prazo);
  const dia = k => k === 1 ? '1 dia' : `${k} dias`;
  const dm = t.prazo.slice(8, 10) + '/' + t.prazo.slice(5, 7);
  const txt = st === 'late' ? `Atrasada há ${dia(-n)} · ${dm}`
    : st === 'soon' ? `${n === 0 ? 'Vence hoje' : n === 1 ? 'Vence amanhã' : `Faltam ${dia(n)}`} · ${dm}`
    : st === 'ok' ? `Faltam ${dia(n)} · ${dm}` : fmtD(t.prazo);
  return `<span class="chip mono${st ? ' dl-' + st : ''}">${esc(txt)}</span>`;
}

/* Each agenda item is an event (with an optional linked culto) or a standalone culto. */
function agendaItems(){
  return [
    ...state.eventos.map(e => ({kind:'eventos', id:e.id, rec:e, data:e.data, hora:e.hora, titulo:e.titulo, tipo:e.tipo || 'Evento', local:e.local, resp:e.responsavel, culto:state.cultos.find(c => c.eventoId === e.id)})),
    ...state.cultos.filter(c => !c.eventoId || !state.eventos.some(e => e.id === c.eventoId))
      .map(c => ({kind:'cultos', id:c.id, rec:c, data:c.data, hora:c.hora, titulo:c.nome || c.tema || 'Evento do Youth', tipo:c.tipo || 'Evento do Youth', local:'', resp:c.dirigente, culto:c}))
  ];
}
const findItem = (kind, id) => agendaItems().find(i => i.kind === kind && i.id === id);
const itemOfCulto = c => (c.eventoId && findItem('eventos', c.eventoId)) || findItem('cultos', c.id) || {kind:'cultos', id:c.id, data:c.data};
const escalasFor = it => state.escalas.filter(e => e.ref ? e.ref === it.kind + ':' + it.id : e.data === it.data).sort((a,b) => areaRank(a.area) - areaRank(b.area) || String(a.area).localeCompare(String(b.area)));
const teamRow = (e, edit) => `<div class="role"><div><b>${esc(e.area)}</b>${e.responsavel ? `<div class="muted" style="font-size:13px">Responsável: ${esc(e.responsavel)}</div>` : ''}</div><span class="p muted">${esc(e.obs || '')}</span>${edit ? W(`<button class="btn ghost" data-act="edit" data-col="escalas" data-id="${esc(e.id)}">Editar</button>`) : '<span></span>'}</div>`;

function repertorioHtml(){
  const t = todayStr(), map = {};
  state.cultos.forEach(c => (c.musicas||[]).forEach(m => {
    if(!m.titulo) return;
    const k = m.titulo.trim().toLowerCase();
    const r = map[k] || (map[k] = {titulo:m.titulo.trim(), artista:'', vezes:0, ultima:'', tons:new Set()});
    r.vezes++; if(m.artista) r.artista = m.artista; if(m.tom) r.tons.add(m.tom);
    if((c.data||'') > r.ultima && (c.data||'') <= t) r.ultima = c.data;
  }));
  const rows = Object.values(map).sort((a,b) => b.vezes - a.vezes || a.titulo.localeCompare(b.titulo));
  if(!rows.length) return empty('Repertório vazio', 'As músicas que vocês registrarem nas ordens dos eventos aparecem aqui, com quantas vezes foram cantadas, o tom usado e a última data.');
  return `<p class="muted" style="margin:-6px 0 14px">${rows.length} músicas registradas nos eventos. Use para evitar repetir demais e lembrar o tom da banda.</p>
  <div class="tablewrap"><table><thead><tr><th>Música</th><th>Artista</th><th>Tons</th><th>Vezes</th><th>Última vez</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td><b>${esc(r.titulo)}</b></td><td class="muted">${esc(r.artista)}</td><td>${[...r.tons].map(x => `<span class="chip key">${esc(x)}</span>`).join(' ')}</td><td class="num">${r.vezes}</td><td class="num">${r.ultima ? esc(fmtD(r.ultima)) : 'Ainda não cantada'}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* Cronograma on screen, laid out like the PDF: info block, then a timed table, then songs. */
const minutes = h => { const [a, b] = String(h || '').split(':').map(Number); return isNaN(a) ? null : a * 60 + (b || 0); };
const hhmm = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
function cronogramaHtml(c){
  const od = c.ordem || [], ms = c.musicas || [];
  const info = [['Tema', c.tema], ['Preletor', c.preletor], ['Dirigente', c.dirigente], ['Ministro de louvor', c.louvor], ['Texto bíblico', c.textos], ['Série', c.serie]].filter(m => m[1]);
  const rows = od.map((o, i) => {
    const m = String(o.item || '').match(/^(.*?)\s*\((\d+)\s*min\)\s*$/i);
    const nome = m ? m[1] : o.item, dur = m ? +m[2] : null, ini = minutes(o.hora);
    const fim = ini != null && dur ? ini + dur : (od[i + 1] && minutes(od[i + 1].hora));
    return `<li class="cr-row">
      <span class="cr-time"><b>${esc(o.hora || '—')}</b>${fim != null && ini != null && fim > ini ? `<small>→ ${hhmm(fim)}</small>` : ''}</span>
      <span class="cr-what"><b>${esc(nome || '')}</b>${dur ? `<span class="cr-dur">${dur} min</span>` : ''}</span>
      <span class="cr-who">${esc(o.responsavel || '')}</span>
    </li>`;
  }).join('');
  const total = od.length && minutes(od[0].hora) != null ? (() => { const last = od[od.length - 1], lm = String(last.item).match(/\((\d+)\s*min\)/i), end = minutes(last.hora) + (lm ? +lm[1] : 0); return `${od[0].hora} às ${hhmm(end)}`; })() : '';
  return `${info.length ? `<dl class="cr-info">${info.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
    <div class="cr-sect"><h3>Cronograma</h3>${total ? `<span class="mono muted">${esc(total)}</span>` : ''}</div>
    ${od.length ? `<ol class="cr-list">${rows}</ol>` : '<p class="muted" style="margin:0">Nenhum momento cadastrado ainda.</p>'}
    ${ms.length ? `<div class="cr-sect"><h3>Músicas</h3><span class="mono muted">${ms.length}</span></div>
      <ol class="cr-songs">${ms.map((s, i) => `<li><span class="cr-n">${pad(i + 1)}</span><span class="cr-song"><b>${esc(s.titulo)}</b>${s.artista ? `<small>${esc(s.artista)}</small>` : ''}</span>${s.tom ? `<span class="chip key">Tom ${esc(s.tom)}</span>` : ''}</li>`).join('')}</ol>` : ''}
    ${c.obs ? `<div class="cr-sect"><h3>Observações</h3></div><p style="margin:0;white-space:pre-wrap">${esc(c.obs)}</p>` : ''}`;
}
function openDetail(kind, id, dtab){
  detailCtx = {kind, id, tab: dtab || (detailCtx && detailCtx.id === id ? detailCtx.tab : 'resp')};
  dlgMode = 'detail'; editing = null;
  renderDetail();
  const dlg = $('#dlg'); if(dlg.isConnected && !dlg.open) dlg.showModal();
}
function renderDetail(){
  const it = findItem(detailCtx.kind, detailCtx.id), dlg = $('#dlg');
  if(!it){ if(dlg.open) dlg.close(); return; }
  const c = it.culto, esq = escalasFor(it), tb = detailCtx.tab;
  if(tb === 'obs'){ markSeen(mentionKey(it)); renderBell(); }
  const ref = it.kind + ':' + it.id;
  let body = '';
  if(tb === 'ordem'){
    if(c){
      body = cronogramaHtml(c) + `<div class="row" style="margin-top:20px">${W(`<button class="btn primary" data-act="edit" data-col="cultos" data-id="${esc(c.id)}">Editar cronograma</button>`)}<button class="btn" data-act="pdf" data-id="${esc(c.id)}">Baixar PDF</button></div>`;
    } else {
      body = `<div class="empty"><strong>Sem cronograma</strong><span>Monte o cronograma deste evento: tema, preletor, dirigente, músicas com tom e os momentos com horário.</span>${W(`<button class="btn primary" data-act="mkculto">+ Montar cronograma</button>`)}</div>`;
    }
  } else if(tb === 'escalas'){
    body = `<div class="sect-h"><h3>Equipes deste evento</h3>${W(`<button class="btn primary" data-act="new" data-col="escalas" data-date="${esc(it.data)}" data-ref="${esc(ref)}">+ Nova equipe</button>`)}</div>
      ${esq.length ? `<div class="roles">${esq.map(e => teamRow(e, true)).join('')}</div>`
        : '<p class="muted" style="margin:0">Nenhuma equipe ainda. Crie as equipes deste evento, como louvor, recepção, mídia e intercessão, com o nome que quiser e um responsável para cada uma.</p>'}`;
  } else if(tb === 'obs'){
    const txt = it.rec.observacoes || '';
    const marc = it.rec.marcados || [];
    const chips = marc.length ? `<div class="row"><span class="eyebrow">Marcados</span>${marc.map(n => `<span class="chip">@${esc(n)}</span>`).join('')}</div>` : '';
    body = canWrite
      ? `<form id="obsform" class="stack" novalidate>
          <div class="fld"><label for="obs-text">Observações do evento</label><textarea id="obs-text" name="observacoes" style="min-height:200px" placeholder="Anote lembretes, pedidos e combinados. Digite @ para marcar alguém da equipe.">${esc(txt)}</textarea></div>
          <div class="mlist" id="mlist" hidden></div>
          ${chips}
          <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13px">${it.rec.obsEm ? 'Última alteração: ' + esc(fmtD(it.rec.obsEm.slice(0,10))) : 'Ainda sem observações.'}</span><button type="submit" class="btn primary">Salvar observações</button></div>
        </form>`
      : (txt ? `<p style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere">${withMentions(txt, marc)}</p>` : '<p class="muted" style="margin:0">Nenhuma observação registrada.</p>');
  } else {
    const ev = it.kind === 'eventos' ? it.rec : null;
    const rows = ev
      ? [['Responsável pelo evento', ev.responsavel],['Tipo', ev.tipo],['Local', ev.local],['Horário', ev.hora]]
      : [['Tipo', it.tipo],['Horário', it.hora]];
    if(c) rows.push(['Dirigente', c.dirigente],['Preletor', c.preletor],['Ministro de louvor', c.louvor]);
    const filled = rows.filter(r => r[1]);
    body = `${filled.length ? `<dl class="meta" style="margin-top:0">${filled.map(([k,v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : '<p class="muted" style="margin:0">Nenhum responsável definido ainda.</p>'}
      ${ev && ev.descricao ? `<p style="margin:14px 0 0;white-space:pre-wrap">${esc(ev.descricao)}</p>` : ''}
      ${esq.length ? `<div class="sect-h" style="margin-top:18px"><h3>Equipes</h3></div><div class="roles">${esq.map(e => teamRow(e, false)).join('')}</div>` : ''}
      ${(tl => tl.length ? `<div class="sect-h" style="margin-top:18px"><h3>Tarefas deste evento</h3></div>${tl.map(todoRow).join('')}` : '')(state.tarefas.filter(x => x.eventoRef === ref).sort(taskSort))}
      <div class="row" style="margin-top:18px">${W(ev ? `<button class="btn primary" data-act="qopen">Editar informações</button>` : '')}${W(c ? `<button class="btn" data-act="edit" data-col="cultos" data-id="${esc(c.id)}">Editar dirigente e preletor</button>` : '')}</div>`;
  }
  const count = {ordem: c && (c.ordem||[]).length ? '✓' : '', escalas: esq.length || '', resp: '', obs: it.rec.observacoes ? '✓' : ''};
  dlg.innerHTML = `<div class="dwrap">
    <div class="dh"><div class="item" style="align-items:center">${tile(it.data, it.data < todayStr())}<div class="body"><div class="eyebrow">${esc(it.tipo)} · ${esc(fmtD(it.data))}${it.hora ? ' · ' + esc(it.hora) : ''}</div><h2>${esc(it.titulo)}</h2></div></div><button type="button" class="x" data-act="close" aria-label="Fechar">×</button></div>
    ${editBar(it)}
    <nav class="steps" aria-label="Seções do compromisso">${DTABS.map(([k,l]) => `<button type="button" data-act="dtab" data-tab="${k}" aria-current="${k === tb ? 'step' : 'false'}">${l}${count[k] ? ` <span>${count[k]}</span>` : ''}</button>`).join('')}</nav>
    <div class="dbody">${body}</div>
  </div>`;
}

/* Inline editor at the top of the event window: the event's own data (or a standalone ordem's name/type/date). */

/* ---------- Tarefas (to-do) ----------
   A list grouped by deadline; each task opens a panel with checklist, notes, owner, deadline, priority and linked event. */
const CHECK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
const prioRank = x => x.prioridade === 'Alta' ? 0 : x.prioridade === 'Baixa' ? 2 : 1;
const addDays = (iso, n) => { const d = parseD(iso); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const taskSort = (a, b) => (a.prazo || '9999').localeCompare(b.prazo || '9999') || prioRank(a) - prioRank(b) || String(a.titulo).localeCompare(String(b.titulo));
function eventLabel(ref){
  if(!ref) return '';
  const [kind, id] = ref.split(':'); const it = findItem(kind, id);
  return it ? it.titulo : '';
}
function todoRow(x){
  const done = x.status === 'feito', itens = x.itens || [], ok = itens.filter(i => i.ok).length, ev = eventLabel(x.eventoRef);
  const check = canWrite

/* Checklist drives the status: all items ticked = Feito; some ticked = Fazendo. */
function syncStatusFromChecklist(){
  const boxes = [...document.querySelectorAll('#tlist .titem input[type=checkbox]')], sel = $('#t-status');
  if(!boxes.length || !sel) return;
  const done = boxes.filter(b => b.checked).length, before = sel.value;
  if(done === boxes.length) sel.value = 'feito';
  else if(done > 0 && before !== 'fazendo') sel.value = 'fazendo';
  else if(done === 0 && before === 'feito') sel.value = 'afazer';
  const big = $('#dlg .check.big'); if(big) big.classList.toggle('on', sel.value === 'feito');
  if(sel.value !== before) toast(sel.value === 'feito' ? 'Todos os itens feitos: tarefa concluída' : sel.value === 'fazendo' ? 'Tarefa em andamento' : 'Tarefa reaberta');

/* ---------- Arquivos ----------
   Files live in the Supabase Storage bucket "arquivos" (webapp only); each file also has a row in
   the "arquivos" collection with its name, folder, size and storage path. */
const PASTAS = [
  ['manuais', 'Manuais', '#FE003E'],
  ['orcamentos', 'Modelos de orçamento', '#FFD004'],
  ['workbooks', 'Workbooks', '#5A11E7'],
  ['diversos', 'Diversos', '#878787']
];
const FOLDER_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6l2.2 2.2h7.2A2.5 2.5 0 0 1 21 8.7v8.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>';
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function fileKind(nome){
  const ext = (String(nome).split('.').pop() || '').toLowerCase();
  if(ext === 'pdf') return ['PDF', '#E10031'];
  if(['doc','docx','odt','rtf','txt','pages'].includes(ext)) return ['DOC', '#1E5EFF'];
  if(['xls','xlsx','csv','ods','numbers'].includes(ext)) return ['XLS', '#12804F'];
  if(['ppt','pptx','key','odp'].includes(ext)) return ['PPT', '#E8590C'];
  if(['jpg','jpeg','png','gif','webp','heic','svg'].includes(ext)) return ['IMG', '#5A11E7'];
  if(['mp3','wav','m4a','mp4','mov'].includes(ext)) return ['MÍDIA', '#0B0B0C'];
  if(['zip','rar','7z'].includes(ext)) return ['ZIP', '#5E5A55'];
  return [(ext || 'ARQ').slice(0, 4).toUpperCase(), '#5E5A55'];
}
function arquivosView(){
  const head = `<div class="bar"><h2>Arquivos</h2></div>`;
  if(!sb) return head + `<div class="empty"><strong>Disponível no app</strong><span>Os arquivos da equipe ficam guardados no webapp. Abra <b>painel-youth.vercel.app</b> para ver, enviar e baixar.</span></div>`;
  if(isLoading(['arquivos'])) return head + loadingBox();
  const files = state.arquivos;
  if(!pastaAberta){
    return head + `<div class="folders">${PASTAS.map(([k, nome, cor]) => {
      const fs = files.filter(f => f.pasta === k), total = fs.reduce((s, f) => s + (f.tamanho || 0), 0);
      return `<button type="button" class="folder" data-act="pasta" data-pasta="${k}" style="--fc:${cor}">
        <span class="folder-ico">${FOLDER_ICON}</span>
        <span class="folder-name">${esc(nome)}</span>
        <span class="folder-meta mono">${fs.length ? `${fs.length} arquivo${fs.length > 1 ? 's' : ''} · ${fmtSize(total)}` : 'Vazia'}</span>
      </button>`;
    }).join('')}</div>`;
  }
  const [k, nome, cor] = PASTAS.find(p => p[0] === pastaAberta) || PASTAS[3];
  const list = files.filter(f => f.pasta === k).sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt'));
  return `<div class="bar"><div class="crumbs"><button type="button" class="btn ghost" data-act="pasta" data-pasta="">‹ Arquivos</button><h2 style="--fc:${cor}"><span class="crumb-dot"></span>${esc(nome)}</h2></div>
    ${A(`<label class="btn primary upl" for="upl-input">+ Enviar arquivos</label><input type="file" id="upl-input" multiple hidden>`)}</div>
    ${list.length ? `<div class="files">${list.map(f => {
      const [tag, tc] = fileKind(f.nome);
      return `<div class="file">
        <span class="ftag" style="background:${tc}">${esc(tag)}</span>
        <div class="fbody"><b class="fname">${esc(f.nome)}</b><span class="muted mono">${fmtSize(f.tamanho || 0)} · ${esc(fmtD((f.criadoEm || '').slice(0, 10)))}${f.enviadoPor ? ' · ' + esc(f.enviadoPor) : ''}</span></div>
        <div class="factions">
          <button type="button" class="btn" data-act="fopen" data-id="${esc(f.id)}">Abrir</button>
          <button type="button" class="btn ghost" data-act="fdown" data-id="${esc(f.id)}">Baixar</button>
          ${A(`<button type="button" class="btn ghost danger-txt" data-act="fdel" data-id="${esc(f.id)}" aria-label="Excluir ${esc(f.nome)}">Excluir</button>`)}
        </div>
      </div>`;
    }).join('')}</div>`
    : `<div class="empty"><strong>Pasta vazia</strong><span>${isAdmin ? 'Envie PDFs, planilhas, documentos ou imagens. Cada arquivo pode ter até 50 MB.' : 'Nenhum arquivo nesta pasta ainda. Só o administrador do painel envia arquivos.'}</span></div>`}`;
}
const safeName = n => String(n).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/-+/g, '-').slice(-120);
async function uploadFiles(fileList){
  const files = [...fileList]; if(!files.length || !sb) return;
  let ok = 0;
  for(const [i, file] of files.entries()){
    if(file.size > 52428800){ toast(`"${file.name}" passa de 50 MB e não foi enviado.`); continue; }
    toast(`Enviando ${i + 1} de ${files.length}: ${file.name}`);
    const id = uid(), caminho = `${pastaAberta}/${id}-${safeName(file.name)}`;
    const up = await sb.storage.from('arquivos').upload(caminho, file, {contentType: file.type || 'application/octet-stream', upsert: false});
    if(up.error){ toast('Não foi possível enviar: ' + up.error.message); continue; }
    if(await save('arquivos', {id, nome: file.name, pasta: pastaAberta, caminho, tamanho: file.size, tipo: file.type || '', enviadoPor: sbUser && sbUser.email || '', criadoEm: new Date().toISOString()})) ok++;
    else await sb.storage.from('arquivos').remove([caminho]);
  }
  if(ok) toast(ok === 1 ? 'Arquivo enviado' : `${ok} arquivos enviados`);
}
async function fileUrl(f, download){
  const {data, error} = await sb.storage.from('arquivos').createSignedUrl(f.caminho, 120, download ? {download: f.nome} : undefined);
  if(error){ toast('Não foi possível abrir: ' + error.message); return null; }
  return data.signedUrl;
}
function openUrl(url, download){
  const a = document.createElement('a'); a.href = url; a.rel = 'noopener';
  if(!download) a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
}
document.addEventListener('change', ev => { if(ev.target.id === 'upl-input'){ const fl = ev.target.files; uploadFiles(fl).then(() => { ev.target.value = ''; }); } });

let chatMsgs = [], chatLoaded = false, chatErr = '';

const localDay = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function chatTime(iso, withDay){
  const d = new Date(iso), hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if(!withDay) return hm;
  const day = localDay(d), t = todayStr();

function chatView(){
  const close = '<button type="button" class="x chat-x" data-act="chat-close" aria-label="Fechar o chat">×</button>';
  if(chatErr === 'missing') return `<div id="chatwrap"><div class="chat-head"><h2>Chat da equipe</h2>${close}</div><div class="chat-empty"><strong>Falta ativar o chat</strong><span class="muted">Rode o arquivo <b>supabase/5-chat.sql</b> no SQL Editor do Supabase e recarregue o app.</span></div></div>`;
  return `<div id="chatwrap">
    <div class="chat-head"><div><h2>Chat da equipe</h2><span class="muted chat-as">Você aparece como <b id="chat-me">${esc(myName())}</b> · <button type="button" class="linkbtn" data-act="chat-name">trocar nome</button></span></div>${close}</div>
    <div id="chatlist" role="log" aria-live="polite" aria-label="Mensagens"></div>
    <form id="chatform" class="chat-compose" novalidate>
      <textarea id="chat-text" rows="1" maxlength="2000" placeholder="Mensagem (use @nome)" aria-label="Mensagem"></textarea>
      <button type="submit" class="chat-send" aria-label="Enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </div>`;
}
// Highlight @Full Name for people the panel knows, then any other single-word @mention.
const chatText = t => {
  const names = [...new Set([...knownPeople(), ...chatMsgs.map(m => m.autor_nome), getMe()].filter(Boolean))];
  return withMentions(t, names).replace(/(^|[\s(])(@[\p{L}][\p{L}\p{N}._-]*)/gu, '$1<span class="mention">$2</span>');
};
function renderChatList(toBottom){
  const box = $('#chatlist'); if(!box) return;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  if(!chatLoaded){ box.innerHTML = '<p class="muted chat-empty">Carregando mensagens…</p>'; return; }
  if(chatErr){ box.innerHTML = `<p class="muted chat-empty">Não foi possível carregar o chat: ${esc(chatErr)}</p>`; return; }
  if(!chatMsgs.length){ box.innerHTML = '<div class="chat-empty"><strong>Comece a conversa</strong><span class="muted">As mensagens ficam aqui para todos os membros da equipe.</span></div>'; return; }
  const me = sbUser ? lower(sbUser.email) : '';
  let html = '', lastDay = '', lastAuthor = '';
  chatMsgs.forEach(m => {
    const d = new Date(m.criado_em), day = localDay(d), mine = lower(m.autor_email) === me;
    if(day !== lastDay){ html += `<div class="cday"><span>${esc(day === todayStr() ? 'Hoje' : day === addDays(todayStr(), -1) ? 'Ontem' : longDate(day))}</span></div>`; lastDay = day; lastAuthor = ''; }
    const showName = !mine && lastAuthor !== m.autor_email;
    lastAuthor = m.autor_email;
    html += `<div class="msg${mine ? ' me' : ''}"><div class="bubble">
      ${showName ? `<b class="who">${esc(m.autor_nome || m.autor_email.split('@')[0])}</b>` : ''}
      <p>${chatText(m.texto)}</p>
      <span class="mtime">${chatTime(m.criado_em)}${(mine || isAdmin) ? ` <button type="button" class="mdel" data-act="mdel" data-id="${esc(m.id)}" aria-label="Apagar mensagem">apagar</button>` : ''}</span>
    </div></div>`;
  });
  box.innerHTML = html;
  if(toBottom || near) box.scrollTop = box.scrollHeight;
  markChatSeen(); updateChatBadge();
}
async function sendChat(){
  const ta = $('#chat-text'), texto = ta.value.trim(); if(!texto || !sb) return;
  ta.value = ''; ta.style.height = '';
  const {data, error} = await sb.from('mensagens').insert({texto, autor_nome: myName()}).select().single();
  if(error){ ta.value = texto; toast(/relation|schema cache/i.test(error.message) ? 'Falta rodar o 5-chat.sql no Supabase.' : 'Não foi possível enviar: ' + error.message); return; }
  if(!chatMsgs.some(m => m.id === data.id)) chatMsgs.push(data);
  chatChanged(true);
}
document.addEventListener('submit', ev => { if(ev.target.id === 'chatform'){ ev.preventDefault(); sendChat(); } });
document.addEventListener('keydown', ev => {
  if(ev.target.id === 'chat-text' && ev.key === 'Enter' && !ev.shiftKey && !matchMedia('(max-width: 640px)').matches){ ev.preventDefault(); sendChat(); }
});
document.addEventListener('input', ev => { if(ev.target.id === 'chat-text'){ const t = ev.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; } });

/* Home: one of the next three agenda items, with its ordem status and teams at a glance. */
function homeEventCard(it, first){
  const c = it.culto, esq = escalasFor(it), key = `data-kind="${it.kind}" data-id="${esc(it.id)}"`;
  const pessoas = [c && c.preletor && 'Preletor: ' + esc(c.preletor), c && c.dirigente && 'Dirigente: ' + esc(c.dirigente), it.kind === 'eventos' && it.resp && 'Responsável: ' + esc(it.resp)].filter(Boolean);
  return `<article class="card agenda-item${first ? ' next' : ''}" data-act="open" ${key}><div class="item">${tile(it.data)}<div class="body">
    <div class="row"><span class="chip">${esc(it.tipo)}</span><span class="eyebrow">${it.hora ? esc(it.hora) + ' · ' : ''}${rel(it.data)}</span></div>
    <h3 style="margin-top:6px"><button class="linkish" data-act="open" ${key}>${esc(it.titulo)}</button></h3>
    ${it.kind === 'eventos' && c && c.tema ? `<div style="margin-top:2px">Tema: <b>${esc(c.tema)}</b></div>` : ''}
    ${it.local || pessoas.length ? `<div class="muted" style="margin-top:4px">${[it.local && 'Local: ' + esc(it.local), ...pessoas].filter(Boolean).join(' · ')}</div>` : ''}
    <div class="row" style="margin-top:10px">
      ${c && (c.ordem || []).length ? '<span class="chip ok">Cronograma pronto</span>' : '<span class="chip warn">Sem cronograma</span>'}
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn" data-act="open" ${key}>Abrir evento</button>
      ${c ? `<button class="btn ghost" data-act="pdf" data-id="${esc(c.id)}">Baixar PDF</button>` : ''}
    </div>
  </div></div></article>`;
}

/* Date: inline month calendar. Time: hour + minute lists. Both keep the value in a hidden input
   named like the field, so the forms read them the same way as before. */
const dpLabel = v => { if(!v) return 'Escolher data'; const d = parseD(v); return `${WDF[d.getDay()]}, ${d.getDate()} de ${MOF[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`; };
const CAL_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function dateWidget(id, name, val, req){
  return `<div class="dp" data-req="${req ? 1 : ''}"><input type="hidden" id="${id}" name="${name}" value="${esc(val)}">
    <button type="button" class="dp-btn" id="${id}-btn" data-act="dp-toggle" aria-expanded="false">${CAL_ICON}<span class="dp-label${val ? '' : ' muted'}">${esc(dpLabel(val))}</span></button>
    <div class="dp-pop" hidden></div></div>`;
}
function renderCal(dp){
  const pop = dp.querySelector('.dp-pop'), val = dp.querySelector('input').value;
  const [y, m] = dp.dataset.ym.split('-').map(Number);
  const start = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate(), t = todayStr();
  let cells = '';
  for(let i = 0; i < start; i++) cells += '<span></span>';
  for(let d = 1; d <= days; d++){
    const iso = `${y}-${pad(m)}-${pad(d)}`;
    cells += `<button type="button" data-act="dp-pick" data-date="${iso}" class="${iso === val ? 'sel' : ''}${iso === t ? ' today' : ''}" aria-label="${esc(dpLabel(iso))}">${d}</button>`;
  }
  pop.innerHTML = `<div class="dp-head"><button type="button" data-act="dp-nav" data-dir="-1" aria-label="Mês anterior">‹</button><b>${MOF[m - 1]} ${y}</b><button type="button" data-act="dp-nav" data-dir="1" aria-label="Próximo mês">›</button></div>
    <div class="dp-grid">${['D','S','T','Q','Q','S','S'].map(w => `<i>${w}</i>`).join('')}${cells}</div>
    <div class="dp-foot"><button type="button" data-act="dp-pick" data-date="${t}">Hoje</button>${dp.dataset.req ? '' : '<button type="button" data-act="dp-pick" data-date="">Sem data</button>'}</div>`;
}
function timeWidget(id, attr, val, label){
  const [h, mi] = (val || '').split(':');
  const mins = [...Array(12)].map((_, i) => pad(i * 5));
  if(mi && !mins.includes(mi)){ mins.push(mi); mins.sort(); }
  return `<div class="tp"><input type="hidden" ${attr} value="${esc(val || '')}">
    <select class="tp-h" id="${id}-h" aria-label="${label} — hora"><option value="">--</option>${[...Array(24)].map((_, i) => `<option ${pad(i) === h ? 'selected' : ''}>${pad(i)}</option>`).join('')}</select>
    <b>:</b>
    <select class="tp-m" id="${id}-m" aria-label="${label} — minutos"><option value="">--</option>${mins.map(x => `<option ${x === mi ? 'selected' : ''}>${x}</option>`).join('')}</select></div>`;
}
document.addEventListener('change', ev => {
  const tp = ev.target.closest('.tp'); if(!tp) return;
  const hs = tp.querySelector('.tp-h'), ms = tp.querySelector('.tp-m');
  if(hs.value && !ms.value) ms.value = '00';
  tp.querySelector('input').value = hs.value ? `${hs.value}:${ms.value}` : '';
});
function missingDate(form){ return [...form.querySelectorAll('.dp[data-req="1"]')].find(dp => !dp.querySelector('input').value); }

function fieldHtml([name,label,type,req,opts,full], val){
  const id = 'f-' + name, r = req ? ' required' : '';
  if(type === 'date') return `<div class="fld${full ? ' full' : ''}"><label for="${id}-btn">${label}</label>${dateWidget(id, name, val, req)}</div>`;
  if(type === 'time') return `<div class="fld${full ? ' full' : ''}"><label for="${id}-h">${label}</label>${timeWidget(id, `id="${id}" name="${name}"`, val, label)}</div>`;
  if(type === 'checkbox') return `<div class="fld check full"><input type="checkbox" id="${id}" name="${name}" ${val ? 'checked' : ''}><label for="${id}" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)">${label}</label></div>`;
  let ctl;
  if(type === 'select') ctl = `<select id="${id}" name="${name}"${r}>${opts.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if(type === 'combo') ctl = `<input type="text" id="${id}" name="${name}" value="${esc(val)}"${r} list="dl-${name}" autocomplete="off" placeholder="Digite ou escolha uma sugestão"><datalist id="dl-${name}">${opts.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
  else if(type === 'textarea') ctl = `<textarea id="${id}" name="${name}"${r}>${esc(val)}</textarea>`;
  else ctl = `<input type="${type}" id="${id}" name="${name}" value="${esc(val)}"${r} autocomplete="off">`;
  return `<div class="fld${full ? ' full' : ''}"><label for="${id}">${label}</label>${ctl}</div>`;
}

function openForm(col, rec, defaults={}){
  const f = FORMS[col], isNew = !rec || !rec.id;
  const base = rec || {...defaults};
  if(col === 'tarefas'){ base.status = (STATUS.find(s => s[0] === (base.status || 'afazer')) || STATUS[0])[1]; }
  if(col === 'avisos' && !base.data) base.data = todayStr();
  const names = f.fields.map(fd => fd[0]);
  const extra = isNew ? Object.fromEntries(Object.entries(base).filter(([k]) => !names.includes(k) && !['id','musicas','ordem','criadoEm','atualizadoEm'].includes(k))) : {};
  editing = {col, id: rec && rec.id, extra, back: dlgMode === 'detail' ? {...detailCtx} : null};
  dlgMode = 'form';
  const dlg = $('#dlg');
  let body, actions;
  if(col === 'cultos'){
    const ms = (base.musicas && base.musicas.length) ? base.musicas : [{},{},{}];
    const od = base.ordem || [];
    const blocks = {
      '#musicas': `<div class="rep" id="rep-musicas"><div class="rep-h"><b>Músicas</b><button type="button" class="btn ghost" data-act="addrow" data-rep="musicas">+ Música</button></div><div class="rows">${ms.map(songRow).join('')}</div></div>`,
      '#ordem': `<div class="rep" id="rep-ordem"><div class="rep-h"><b>Momentos do evento</b><span class="row"><button type="button" class="btn ghost" data-act="padrao">Usar cronograma padrão</button><button type="button" class="btn ghost" data-act="addrow" data-rep="ordem">+ Momento</button></span></div><div class="rows">${od.map(ordRow).join('') || '<p class="muted hint" style="margin:0;font-size:14px">Adicione os momentos com horário e responsável, ou comece pelo cronograma padrão.</p>'}</div></div>`,
      '#resumo': '<div id="resumo"></div>'
    };
    const fmap = Object.fromEntries(f.fields.map(fd => [fd[0], fd]));
    body = `<nav class="steps" aria-label="Etapas">${CULTO_STEPS.map(([l], i) => `<button type="button" data-act="step" data-step="${i}"><span>${i+1}</span>${l}</button>`).join('')}</nav>`
      + CULTO_STEPS.map(([, items, hint], i) => `<div class="db" data-panel="${i}"${i ? ' hidden' : ''}><p class="hint-step">${hint}</p>${items.filter(k => !(base.eventoId && (k === 'nome' || k === 'tipo'))).map(k => k[0] === '#' ? blocks[k] : fieldHtml(fmap[k], base[k] ?? '')).join('')}</div>`).join('');
    actions = `<button type="button" class="btn" data-act="prev">← Anterior</button><button type="submit" class="btn" id="btn-save">Salvar</button><button type="button" class="btn primary" data-act="next">Próximo →</button><button type="submit" class="btn primary" data-pdf="1">Salvar e baixar PDF</button>`;
  } else {
    body = `<div class="db">${f.fields.map(fd => fieldHtml(fd, base[fd[0]] ?? '')).join('')}</div>`;
    actions = `<button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary" id="btn-save">Salvar</button>`;
  }
  dlg.innerHTML = `<form id="frm" novalidate>
    <div class="dh"><h2>${f.head ? (isNew ? (f.novo || 'Nova') + ' ' : 'Editar ') + f.head : (isNew ? 'Novo ' : 'Editar ') + f.title}</h2><button type="button" class="x" data-act="close" aria-label="Fechar">×</button></div>
    ${body}
    <div class="df"><span>${isNew ? '' : `<button type="button" class="btn danger" data-act="delete">Excluir</button>`}</span><span class="row">${actions}</span></div>
  </form>`;
  if(!dlg.open) dlg.showModal();
  if(col === 'cultos') setStep(0);
  else { const first = dlg.querySelector('input,select,textarea'); if(first) first.focus(); }
}

const CULTO_STEPS = [
  ['Dados gerais', ['nome','tipo','data','hora','serie','dirigente'], 'Quando é o evento e quem dirige.'],
  ['Palavra', ['tema','textos','preletor'], 'O tema da mensagem, os textos bíblicos e quem vai pregar.'],
  ['Louvor', ['louvor','#musicas'], 'Quem ministra o louvor e as músicas, com o tom da banda.'],
  ['Cronograma', ['#ordem'], 'Os momentos do evento com horário e responsável.'],
  ['Revisão', ['obs','#resumo'], 'Confira tudo, acrescente observações e gere o PDF para a equipe.']
];
let step = 0;
function setStep(i){
  step = Math.max(0, Math.min(CULTO_STEPS.length - 1, i));
  const last = step === CULTO_STEPS.length - 1;
  document.querySelectorAll('#dlg [data-panel]').forEach(p => p.hidden = +p.dataset.panel !== step);
  document.querySelectorAll('#dlg .steps button').forEach(b => b.setAttribute('aria-current', +b.dataset.step === step ? 'step' : 'false'));
  $('#dlg [data-act=prev]').hidden = step === 0;
  $('#dlg [data-act=next]').hidden = last;
  $('#dlg [data-pdf]').hidden = !last;
  if(last) renderResumo();
  const first = $(`#dlg [data-panel="${step}"]`).querySelector('input,select,textarea');
  if(first) first.focus();
}
function renderResumo(){
  const c = readForm($('#frm'), 'cultos'), warn = [];
  if(!c.data) warn.push('Falta a data do evento.');

  if(!c.dirigente) warn.push('Nenhum dirigente definido.');
  if(!c.musicas.length) warn.push('Nenhuma música registrada.');
  if(!c.ordem.length) warn.push('O cronograma está vazio.');
  const esq = c.data ? state.escalas.filter(e => e.data === c.data).length : 0;
  $('#resumo').innerHTML = `<div class="eyebrow">${esc(longDate(c.data))}${c.hora ? ' · ' + esc(c.hora) : ''}</div>
    <h3>${esc(c.tema || 'Evento sem tema definido')}</h3>
    <div class="muted">${[c.preletor && 'Preletor: ' + esc(c.preletor), c.dirigente && 'Dirigente: ' + esc(c.dirigente), c.louvor && 'Louvor: ' + esc(c.louvor)].filter(Boolean).join(' · ')}</div>
    <div class="row"><span class="chip">${c.musicas.length} música${c.musicas.length === 1 ? '' : 's'}</span><span class="chip">${c.ordem.length} momento${c.ordem.length === 1 ? '' : 's'}</span><span class="chip">${esq} equipe${esq === 1 ? '' : 's'} nesta data</span></div>
    ${warn.map(w => `<div class="warn">${w}</div>`).join('')}
    <div class="muted" style="font-size:13px">O PDF traz o cabeçalho do Youth, os dados do evento, o cronograma com horários, as músicas com tom e as observações.</div>`;

function collectRows(rep){

function readForm(form, col){
  const rec = {};
  FORMS[col].fields.forEach(([name,,type]) => {
    const el = form.elements[name];
    if(!el) return;

  if(col === 'tarefas') rec.status = (STATUS.find(s => s[1] === rec.status) || STATUS[0])[0];
  if(col === 'cultos'){ rec.musicas = collectRows('musicas'); rec.ordem = collectRows('ordem'); }
  return rec;
}

/* ---------- Marcações (@) e sino ----------
   Mentions are matched by name, so people without a claude.ai account can be marked.
   "Who am I" and what was already read stay in this browser only. */
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function knownPeople(){
  const m = new Map();
  const add = v => String(v || '').split(/\s*,\s*/).forEach(x => { x = x.trim(); if(x && x.length <= 60 && !m.has(norm(x))) m.set(norm(x), x); });
  state.eventos.forEach(e => { add(e.responsavel); (e.marcados || []).forEach(add); });
  state.cultos.forEach(c => { add(c.dirigente); add(c.preletor); add(c.louvor); (c.ordem || []).forEach(o => add(o.responsavel)); (c.marcados || []).forEach(add); });
  state.escalas.forEach(e => add(e.responsavel));
  state.tarefas.forEach(t => add(t.responsavel));
  return [...m.values()].sort((a, b) => a.localeCompare(b, 'pt'));
}
function computeMentions(text){
  const nt = norm(text), out = new Map();
  [...knownPeople(), ...((detailCtx && detailCtx.picked) || [])].forEach(n => { if(nt.includes('@' + norm(n))) out.set(norm(n), n); });
  for(const m of text.matchAll(/@([\p{L}][\p{L}\p{N}.\-]*)/gu)){
    const tok = m[1].replace(/[.\-]+$/, ''), k = norm(tok);
    if(tok && ![...out.keys()].some(x => x === k || x.startsWith(k + ' '))) out.set(k, tok);
  }
  const keys = [...out.keys()];
  return keys.filter(k => !keys.some(o => o !== k && o.startsWith(k + ' '))).map(k => out.get(k));
}
function withMentions(text, names){
  let h = esc(text); const marks = [];
  [...names].sort((a, b) => b.length - a.length).forEach(n => { const t = esc('@' + n); if(h.includes(t)){ h = h.split(t).join('\u0000' + marks.length + '\u0000'); marks.push(t); } });
  return h.replace(/\u0000(\d+)\u0000/g, (_, i) => `<span class="mention">${marks[i]}</span>`);
}
function mentionQuery(ta){ const m = ta.value.slice(0, ta.selectionStart).match(/@([^@\n]{0,40})$/); return m ? m[1] : null; }
function renderMentionList(ta){
  const box = $('#mlist'); if(!box) return;
  const q = mentionQuery(ta);
  if(q === null){ box.hidden = true; return; }
  const nq = norm(q);
  const opts = knownPeople().filter(n => !nq || norm(n).startsWith(nq) || norm(n).split(' ').some(w => w.startsWith(nq))).slice(0, 6);
  if(!opts.length && /\s/.test(q)){ box.hidden = true; return; }
  const exact = opts.some(n => norm(n) === nq);
  box.innerHTML = opts.map(n => `<button type="button" data-act="pick" data-name="${esc(n)}">@${esc(n)}</button>`).join('')
    + (q.trim() && !exact ? `<button type="button" data-act="pick" data-name="${esc(q.trim())}">Marcar “${esc(q.trim())}”</button>` : '')
    || '<span class="muted" style="padding:6px 8px;font-size:13px">Digite o nome de quem você quer marcar.</span>';
  box.hidden = false;
}
function pickMention(name){
  const ta = $('#obs-text'); if(!ta) return;
  const q = mentionQuery(ta); if(q === null) return;
  const pos = ta.selectionStart, start = pos - q.length - 1;
  ta.value = ta.value.slice(0, start) + '@' + name + ' ' + ta.value.slice(pos);
  const caret = start + name.length + 2;
  ta.focus(); ta.setSelectionRange(caret, caret);
  detailCtx.picked = [...(detailCtx.picked || []), name]; detailCtx.obsDirty = true;
  $('#mlist').hidden = true;
}

const markSeen = k => { const s = getSeen(); if(s.includes(k)) return; s.push(k); seenMem = s; try { localStorage.setItem('youth-seen', JSON.stringify(s.slice(-500))); } catch(e){} };
const mentionKey = it => it.kind + ':' + it.id + ':' + (it.rec.obsEm || '');
function myMentions(){
  const me = getMe(); if(!me) return [];

  return agendaItems().filter(it => (it.rec.marcados || []).some(n => norm(n) === k)).map(it => ({it, key: mentionKey(it)}));

function myChatMentions(){

    .map(m => ({msg: m, key: 'chat:' + m.id}));
}
function renderBell(){
  const seen = getSeen(), list = myMentions(), chatList = myChatMentions();
  const unread = list.filter(m => !seen.includes(m.key)).length + chatList.filter(m => !seen.includes(m.key)).length;

    ${!me ? '<p class="muted" style="margin:0;font-size:14px">Escolha seu nome para ver em quais eventos você foi marcado. A escolha fica salva só neste aparelho.</p>'
      : sorted.length ? `<div class="eyebrow">Você foi marcado em</div>${sorted.map(m => `<button type="button" class="notif ${m.novo ? 'unread' : ''}" data-act="notif" data-kind="${m.it.kind}" data-id="${esc(m.it.id)}">
