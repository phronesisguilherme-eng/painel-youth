          <span class="muted mono">${esc(fmtD(m.it.data))}</span>
          <span style="font-size:13px;overflow-wrap:anywhere">${esc((m.it.rec.observacoes || '').slice(0, 110))}${(m.it.rec.observacoes || '').length > 110 ? '…' : ''}</span>
        </button>`).join('')}`
      : chatList.length ? '' : '<p class="muted" style="margin:0;font-size:14px">Nenhuma marcação para você ainda.</p>'}
    ${me && chatList.length ? `<div class="eyebrow">No chat da equipe</div>${chatList.slice(-8).reverse().map(m => { const novo = !seen.includes(m.key); return `<button type="button" class="notif ${novo ? 'unread' : ''}" data-act="notif-chat">
        <span class="row" style="justify-content:space-between"><b>${esc(m.msg.autor_nome || m.msg.autor_email.split('@')[0])}</b>${novo ? '<span class="chip ok">Nova</span>' : ''}</span>
        <span class="muted mono">${esc(chatTime(m.msg.criado_em, true))}</span>
        <span style="font-size:13px;overflow-wrap:anywhere">${esc(m.msg.texto.slice(0, 110))}${m.msg.texto.length > 110 ? '…' : ''}</span>
      </button>`; }).join('')}` : ''}`;
}

/* ---------- Backup ---------- */
async function saveFile(filename, data){
  let dl = null;
  try { dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch(e){}
  if(!dl){
    // Standalone webapp: a normal browser download.
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Download iniciado'); return;
  }
  try { await dl.save({filename, data}); toast('Arquivo salvo'); }
  catch(e){ if(e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'Já existe um download aguardando confirmação.' : 'Não foi possível baixar o arquivo.'); }
}
async function downloadBackup(csv){
  if(isLoading(COLS)){ toast('Aguarde os dados carregarem.'); return; }
  if(!csv){
    const data = {painel: 'Painel Youth', geradoEm: new Date().toISOString(), colecoes: Object.fromEntries(COLS.map(c => [c, state[c]]))};
    return saveFile(`backup-painel-youth-${todayStr()}.json`, new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}));
  }
  const q = v => '"' + String(v ?? '').replace(/"/g, '""').replace(/\r?\n/g, ' ') + '"';
  const head = ['Data','Horário','Evento','Tipo','Local','Responsável','Tema','Preletor','Dirigente','Equipes','Detalhes','Observações'];
  const rows = byDate(agendaItems().filter(x => x.data)).map(it => {
    const c = it.culto || {};
    return [it.data.split('-').reverse().join('/'), it.hora, it.titulo, it.tipo, it.local, it.resp, c.tema, c.preletor, c.dirigente,
      escalasFor(it).map(e => e.area + (e.responsavel ? ' (' + e.responsavel + ')' : '')).join(', '), it.kind === 'eventos' ? it.rec.descricao : '', it.rec.observacoes].map(q).join(';');
  });
  return saveFile(`agenda-youth-${todayStr()}.csv`, new Blob(['﻿' + [head.map(q).join(';'), ...rows].join('\r\n')], {type: 'text/csv'}));
}

function longDate(s){ if(!s) return 'Data a definir'; const d = parseD(s); return `${WDF[d.getDay()]}, ${d.getDate()} de ${MOF[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`; }

function buildCultoPdf(c){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const PW = 210, PH = 297, M = 18, CW = PW - 2*M;
  const INK = [11,11,12], MUTED = [94,90,85], ACC = [232,0,63], SUN = [255,208,4], LINE = [226,222,214], ZEBRA = [241,239,234];
  let y = 0;
  const color = c3 => doc.setTextColor(c3[0], c3[1], c3[2]);
  const font = (style, size) => { doc.setFont('helvetica', style); doc.setFontSize(size); };
  const ensure = h => { if(y + h > PH - 18){ doc.addPage(); y = 20; } };
  const section = title => {
    ensure(18); y += 6;
    font('bold', 9); color(ACC); doc.text(title.toUpperCase(), M, y, {charSpace:0.4});
    y += 2.5; doc.setDrawColor(INK[0], INK[1], INK[2]); doc.setLineWidth(0.5); doc.line(M, y, PW - M, y); y += 6;
  };

  doc.setFillColor(INK[0], INK[1], INK[2]); doc.rect(0, 0, PW, 32, 'F');
  let logoOk = false;
  if(LOGO_DATA){ try { doc.addImage(LOGO_DATA, 'PNG', M, 5, 42, 18); logoOk = true; } catch(e){} }
  if(!logoOk){ font('bold', 26); doc.setTextColor(255,255,255); doc.text('YOUTH*', M, 18); }
  font('normal', 9); doc.setTextColor(163,160,154); doc.text('MINISTÉRIO DE JOVENS · ORDEM DO EVENTO', M, 28.5, {charSpace:0.3});
  [[254,0,62,4],[255,208,4,3],[90,17,231,2],[135,135,135,1]].reduce((x, [r,g,b,w]) => { const ww = PW * w / 10; doc.setFillColor(r,g,b); doc.rect(x, 32, ww, 1.8, 'F'); return x + ww; }, 0);
  doc.setFillColor(SUN[0], SUN[1], SUN[2]); doc.roundedRect(PW - M - 46, 11, 46, 12, 2, 2, 'F');
  font('bold', 10); doc.setTextColor(43,34,0);
  doc.text(c.data ? c.data.split('-').reverse().join('/') : 'A definir', PW - M - 23, 16, {align:'center'});
  font('normal', 8); doc.text(c.hora ? 'às ' + c.hora : 'horário a definir', PW - M - 23, 20.5, {align:'center'});

  y = 44;
  font('bold', 10); color(MUTED); doc.text(longDate(c.data).toUpperCase() + (c.hora ? '  ·  ' + c.hora : ''), M, y);
  y += 9;
  font('bold', 21); color(INK);
  const tl = doc.splitTextToSize(c.tema || 'Evento sem tema definido', CW);
  doc.text(tl, M, y); y += tl.length * 8.5;
  if(c.serie){ font('normal', 11); color(MUTED); doc.text('Série: ' + c.serie, M, y); y += 6; }

  const info = [['Preletor', c.preletor], ['Dirigente', c.dirigente], ['Ministro de louvor', c.louvor], ['Texto bíblico', c.textos]].filter(x => x[1]);
  if(info.length){
    y += 3;
    const colW = (CW - 8) / 2;
    for(let i = 0; i < info.length; i += 2){
      const pair = info.slice(i, i + 2);
      const lines = pair.map(([, v]) => { font('bold', 11.5); return doc.splitTextToSize(v, colW); });
      const h = 6 + Math.max(...lines.map(l => l.length)) * 5.2;
      ensure(h + 2);
      pair.forEach(([k], j) => {
        const x = M + j * (colW + 8);
        font('bold', 7.5); color(MUTED); doc.text(k.toUpperCase(), x, y, {charSpace:0.3});
        font('bold', 11.5); color(INK); doc.text(lines[j], x, y + 5.5);
      });
      y += h + 2;
    }
  }

  const ordem = c.ordem || [];
  if(ordem.length){
    section('Ordem do evento');
    const cH = 22, cR = 52, cI = CW - cH - cR;
    font('bold', 7.5); color(MUTED);
    doc.text('HORÁRIO', M + 2, y); doc.text('MOMENTO', M + cH, y); doc.text('RESPONSÁVEL', M + cH + cI, y); y += 3;
    ordem.forEach((o, i) => {
      font('bold', 11); const il = doc.splitTextToSize(o.item || '', cI - 4);
      font('normal', 10); const rl = doc.splitTextToSize(o.responsavel || '', cR - 2);
      const h = Math.max(il.length, rl.length, 1) * 5 + 4;
      ensure(h);
      if(i % 2 === 0){ doc.setFillColor(ZEBRA[0], ZEBRA[1], ZEBRA[2]); doc.rect(M, y, CW, h, 'F'); }
      const ty = y + 5.6;
      font('bold', 10.5); color(ACC); doc.text(o.hora || '—', M + 2, ty);
      font('bold', 11); color(INK); doc.text(il, M + cH, ty);
      font('normal', 10); color(MUTED); doc.text(rl, M + cH + cI, ty);
      y += h;
    });
  }

  const ms = c.musicas || [];
  if(ms.length){
    section('Músicas');
    ms.forEach((m, i) => {
      font('bold', 11); const tl2 = doc.splitTextToSize(m.titulo, CW - 40);
      const h = tl2.length * 5 + (m.artista ? 5 : 0) + 4;
      ensure(h);
      font('bold', 10); color(MUTED); doc.text(String(i + 1).padStart(2, '0'), M, y + 4.5);
      font('bold', 11); color(INK); doc.text(tl2, M + 10, y + 4.5);
      if(m.artista){ font('normal', 9.5); color(MUTED); doc.text(m.artista, M + 10, y + 4.5 + tl2.length * 5); }
      if(m.tom){
        doc.setFillColor(SUN[0], SUN[1], SUN[2]); doc.roundedRect(PW - M - 22, y + 0.5, 22, 6.5, 1.5, 1.5, 'F');
        font('bold', 9); doc.setTextColor(43,34,0); doc.text('Tom ' + m.tom, PW - M - 11, y + 5, {align:'center'});
      }
      y += h;
      doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setLineWidth(0.2); doc.line(M + 10, y - 1.5, PW - M, y - 1.5);
    });
  }

  const esc2 = c.data ? escalasFor(itemOfCulto(c)) : [];
  if(esc2.length){
    section('Equipes');
    esc2.forEach(e => {
      font('normal', 10.5); const pl = doc.splitTextToSize([e.responsavel && 'Responsável: ' + e.responsavel, e.obs && '(' + e.obs + ')'].filter(Boolean).join(' · ') || '-', CW - 48);
      font('bold', 10); const nl = doc.splitTextToSize(e.area || '', 44);
      const h = Math.max(pl.length, nl.length) * 5 + 3;
      ensure(h);
      font('bold', 10); color(INK); doc.text(nl, M, y + 4);
      font('normal', 10.5); color(INK); doc.text(pl, M + 48, y + 4);
      y += h;
    });
  }

  if(c.obs){
    section('Observações');
    font('normal', 10.5); color(INK);
    doc.splitTextToSize(c.obs, CW).forEach(l => { ensure(5.5); doc.text(l, M, y); y += 5.2; });
  }

  const n = doc.getNumberOfPages(), now = new Date();
  for(let p = 1; p <= n; p++){
    doc.setPage(p);
    doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setLineWidth(0.2); doc.line(M, PH - 12, PW - M, PH - 12);
    font('normal', 8); color(MUTED);
    doc.text(`Painel Youth · gerado em ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`, M, PH - 7);
    doc.text(`Página ${p} de ${n}`, PW - M, PH - 7, {align:'right'});
  }
  return doc;
}

async function cultoPdf(c){
  if(!window.jspdf){ toast('O gerador de PDF não carregou. Recarregue a página.'); return; }
  let blob;
  try { blob = buildCultoPdf(c).output('blob'); }
  catch(e){ toast('Não foi possível montar o PDF.'); return; }
  const nome = ('Ordem do evento ' + (c.data ? c.data.split('-').reverse().join('-') : 'sem data') + (c.tema ? ' - ' + c.tema : '')).replace(/[\\/:*?"<>|]/g, '').slice(0, 120) + '.pdf';
  await saveFile(nome, blob);
}

document.addEventListener('click', async ev => {
  if(!ev.target.closest('.bellwrap')) $('#bellpop').hidden = true;
  if(!ev.target.closest('#mlist, #obs-text') && $('#mlist')) $('#mlist').hidden = true;
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act === 'tab'){ tab = b.dataset.tab; try{ localStorage.setItem('youth-tab', tab); }catch(e){} render(); window.scrollTo(0,0); }
  else if(act === 'seg'){ seg[b.dataset.key] = b.dataset.val; render(); }
  else if(act === 'new'){ const d = {}; if(b.dataset.date) d.data = b.dataset.date; if(b.dataset.ref) d.ref = b.dataset.ref;
    else if(b.dataset.col === 'escalas'){ const p = byDate(state.cultos.filter(c => c.data >= todayStr()))[0]; if(p){ const it = itemOfCulto(p); d.data = p.data; d.ref = it.kind + ':' + it.id; } }
    openForm(b.dataset.col, null, d); }
  else if(act === 'open'){ openDetail(b.dataset.kind, b.dataset.id, b.dataset.tab); }
  else if(act === 'bell'){ const p = $('#bellpop'); p.hidden = !p.hidden; renderBell(); }
  else if(act === 'notif'){ $('#bellpop').hidden = true; openDetail(b.dataset.kind, b.dataset.id, 'obs'); }
  else if(act === 'pick'){ pickMention(b.dataset.name); }
  else if(act === 'backup-json' || act === 'backup-csv'){ b.disabled = true; await downloadBackup(act === 'backup-csv'); b.disabled = false; }
  else if(act === 'senha'){
    dlgMode = 'pass'; editing = null;
    $('#dlg').innerHTML = `<form id="passform" novalidate>
      <div class="dh"><h2>Trocar minha senha</h2><button type="button" class="x" data-act="close" aria-label="Fechar">×</button></div>
      <div class="db">
        <p class="hint-step">Conta: <b>${esc(sbUser && sbUser.email || '')}</b>. A senha precisa ter pelo menos 6 caracteres.</p>
        <div class="fld full"><label for="pw1">Nova senha</label><input id="pw1" name="pw1" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="fld full"><label for="pw2">Repita a nova senha</label><input id="pw2" name="pw2" type="password" autocomplete="new-password" minlength="6" required></div>
        <p class="muted full" id="pw-msg" role="alert" style="margin:0;min-height:1.4em"></p>
      </div>
      <div class="df"><span></span><span class="row"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Salvar nova senha</button></span></div>
    </form>`;
    $('#dlg').showModal(); setTimeout(() => $('#pw1').focus(), 0);
  }
  else if(act === 'logout'){ if(sb) await sb.auth.signOut(); location.reload(); }
  else if(act === 'notif-chat'){ $('#bellpop').hidden = true; openChat(); }
  else if(act === 'chat-open'){ openChat(); }
  else if(act === 'chat-close'){ closeChat(); }
  else if(act === 'chat-hide'){ setFabHidden(true); toast('Botão do chat escondido. Para trazer de volta, use "Mostrar chat" no rodapé.'); }
  else if(act === 'chat-show'){ setFabHidden(false); openChat(); }
  else if(act === 'chat-name'){
    const cur = myName(), box = b.closest('.chat-as');
    box.innerHTML = `<input id="chat-name-in" value="${esc(getMe() || cur)}" maxlength="40" aria-label="Seu nome no chat"> <button type="button" class="linkbtn" data-act="chat-name-ok">salvar</button>`;
    $('#chat-name-in').focus();
  }
  else if(act === 'chat-name-ok'){
    const v = ($('#chat-name-in').value || '').trim(); if(v) setMe(v);
    b.closest('.chat-as').innerHTML = `Você aparece como <b id="chat-me">${esc(myName())}</b> · <button type="button" class="linkbtn" data-act="chat-name">trocar nome</button>`;
    renderBell(); toast('Nome salvo neste aparelho');
  }
  else if(act === 'mdel'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'confirmar?'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'apagar'; } }, 4000); return; }
    const {error} = await sb.from('mensagens').delete().eq('id', b.dataset.id);
    if(error){ toast('Não foi possível apagar: ' + error.message); return; }
    chatMsgs = chatMsgs.filter(m => m.id !== b.dataset.id); chatChanged();
  }
  else if(act === 'pasta'){ pastaAberta = b.dataset.pasta || null; render(); window.scrollTo(0, 0); }
  else if(act === 'fopen' || act === 'fdown'){
    const f = state.arquivos.find(x => x.id === b.dataset.id); if(!f) return;
    b.disabled = true; const url = await fileUrl(f, act === 'fdown'); b.disabled = false;
    if(url) openUrl(url, act === 'fdown');
  }
  else if(act === 'fdel'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Confirmar'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Excluir'; } }, 4000); return; }
    const f = state.arquivos.find(x => x.id === b.dataset.id); if(!f) return;
    const rm = await sb.storage.from('arquivos').remove([f.caminho]);
    if(rm.error){ toast('Não foi possível excluir: ' + rm.error.message); return; }
    if(await removeRec('arquivos', f.id)) toast('Arquivo excluído');
  }
  else if(act === 'topen'){ openTask(b.dataset.id); }
  else if(act === 'tcheck'){ b.disabled = true; await toggleTask(b.dataset.id); }
  else if(act === 'tdcheck'){ const s = $('#t-status'); s.value = s.value === 'feito' ? 'afazer' : 'feito'; b.classList.toggle('on', s.value === 'feito'); }
  else if(act === 'titem-rm'){ b.closest('.titem').remove(); updateProg(); syncStatusFromChecklist(); }
  else if(act === 'tdel'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Clique de novo para excluir'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Excluir'; } }, 4000); return; }
    if(await removeRec('tarefas', taskCtx.id)){ toast('Tarefa excluída'); $('#dlg').close(); }
  }
  else if(act === 'dp-toggle'){
    const dp = b.closest('.dp'), pop = dp.querySelector('.dp-pop'), open = pop.hidden;
    document.querySelectorAll('.dp-pop').forEach(p => { p.hidden = true; p.closest('.dp').querySelector('.dp-btn').setAttribute('aria-expanded', 'false'); });
    if(open){ const v = dp.querySelector('input').value || todayStr(); dp.dataset.ym = v.slice(0, 7); renderCal(dp); pop.hidden = false; b.setAttribute('aria-expanded', 'true'); }
  }
  else if(act === 'dp-nav'){
    const dp = b.closest('.dp'); let [y, m] = dp.dataset.ym.split('-').map(Number);
    m += +b.dataset.dir; if(m < 1){ m = 12; y--; } if(m > 12){ m = 1; y++; }
    dp.dataset.ym = `${y}-${pad(m)}`; renderCal(dp);
  }
  else if(act === 'dp-pick'){
    const dp = b.closest('.dp'), v = b.dataset.date, lab = dp.querySelector('.dp-label');
    dp.querySelector('input').value = v; lab.textContent = dpLabel(v); lab.classList.toggle('muted', !v);
    dp.querySelector('.dp-pop').hidden = true; dp.querySelector('.dp-btn').setAttribute('aria-expanded', 'false'); dp.querySelector('.dp-btn').focus();
  }
  else if(act === 'qopen'){ detailCtx.editOpen = true; renderDetail(); const f = $('#qedit input'); if(f) f.focus(); }
  else if(act === 'qcancel'){ detailCtx.editOpen = false; renderDetail(); }
  else if(act === 'qdel'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Clique de novo para excluir'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Excluir evento'; } }, 4000); return; }
    if(await removeRec(detailCtx.kind, detailCtx.id)){ toast('Evento excluído'); $('#dlg').close(); }
  }
  else if(act === 'dtab'){ detailCtx.tab = b.dataset.tab; detailCtx.obsDirty = false; renderDetail(); }
  else if(act === 'mkculto'){ const it = findItem(detailCtx.kind, detailCtx.id); if(it) openForm('cultos', null, {data: it.data, hora: it.hora, eventoId: it.id}); }
  else if(act === 'edit'){ const r = state[b.dataset.col].find(x => x.id === b.dataset.id); if(r) openForm(b.dataset.col, r); }
  else if(act === 'dup'){ const r = state.cultos.find(x => x.id === b.dataset.id); if(r){ const c = JSON.parse(JSON.stringify(r)); delete c.id; delete c.criadoEm; delete c.eventoId; c.data = ''; openForm('cultos', null, c); } }
  else if(act === 'move'){ const r = state.tarefas.find(x => x.id === b.dataset.id); if(r){ b.disabled = true; await save('tarefas', {...r, status: b.dataset.to}); } }
  else if(act === 'close'){ if(dlgMode === 'form' && editing && editing.back) openDetail(editing.back.kind, editing.back.id, editing.back.tab); else $('#dlg').close(); }
  else if(act === 'step'){ setStep(+b.dataset.step); }
  else if(act === 'prev'){ setStep(step - 1); }
  else if(act === 'next'){ setStep(step + 1); }
  else if(act === 'pdf'){ const r = state.cultos.find(x => x.id === b.dataset.id); if(r) cultoPdf(r); }
  else if(act === 'addrow'){ const box = $(`#rep-${b.dataset.rep} .rows`); box.querySelector('.hint')?.remove(); box.insertAdjacentHTML('beforeend', b.dataset.rep === 'musicas' ? songRow() : ordRow()); box.lastElementChild.querySelector('input').focus(); }
  else if(act === 'rmrow'){ b.closest('.rrow').remove(); }
  else if(act === 'padrao'){ const box = $('#rep-ordem .rows'); const dir = $('#f-dirigente')?.value || '', pre = $('#f-preletor')?.value || '', lv = $('#f-louvor')?.value || '';
    box.innerHTML = ORDEM_PADRAO.map(([h,i,who]) => ordRow({hora:h, item:i, responsavel: {dir, lv, pre}[who] || ''})).join(''); }
  else if(act === 'delete'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Clique de novo para excluir'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Excluir'; } }, 4000); return; }
    const {col, id, back} = editing;
    if(await removeRec(col, id)){
      toast('Excluído');
      if(back && !(back.kind === col && back.id === id)) openDetail(back.kind, back.id, back.tab); else $('#dlg').close();
    }
  }
});
$('#dlg').addEventListener('click', ev => { if(ev.target.id === 'dlg') ev.target.close(); });
$('#dlg').addEventListener('close', () => { dlgMode = null; editing = null; });

init();
</script>
