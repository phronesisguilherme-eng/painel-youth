/* ---------- Forms ---------- */
const FORMS = {
  eventos: {title:'evento', fields:[['titulo','Nome do evento','text',1,null,1],['tipo','Tipo','select',0,TIPOS],['local','Local','text'],['data','Data','date',1],['hora','Horário','time'],['responsavel','Responsável','text'],['descricao','Detalhes','textarea',0,null,1]]},
  escalas: {title:'equipe', head:'equipe', ok:'Equipe salva', fields:[['area','Nome da equipe','combo',1,AREAS],['responsavel','Responsável pela equipe','text'],['data','Data','date',1],['obs','Observação','text',0,null,1]]},
  tarefas: {title:'tarefa', fields:[['titulo','Tarefa','text',1,null,1],['responsavel','Responsável','text'],['prazo','Prazo','date'],['status','Situação','select',0,STATUS.map(s=>s[1])],['prioridade','Prioridade','select',0,PRIOS],['descricao','Detalhes','textarea',0,null,1]]},
  avisos: {title:'aviso', fields:[['titulo','Título','text',1,null,1],['texto','Mensagem','textarea',1,null,1],['autor','Assinado por','text'],['data','Data','date',1],['fixado','Fixar no topo do mural','checkbox']]},
  cultos: {title:'evento', head:'cronograma', novo:'Novo', ok:'Cronograma salvo', fields:[['nome','Nome do evento','text',0,null,1],['tipo','Tipo de evento','select',0,['Evento do Youth', ...TIPOS]],['data','Data','date',1],['hora','Horário','time'],['tema','Tema da mensagem','text',0,null,1],['serie','Série (opcional)','text'],['textos','Texto(s) bíblico(s)','text',0,null,1],['preletor','Preletor','text'],['dirigente','Dirigente','text'],['louvor','Ministro de louvor','text'],['obs','Observações','textarea',0,null,1]]}
};

/* Date: inline month calendar. Time: hour + minute lists. Both keep the value in a hidden input
   named like the field, so the forms read them the same way as before. */
const dpLabel = v => { if(!v) return 'Escolher data'; const d = parseD(v); return `${WDF[d.getDay()]}, ${d.getDate()} de ${MOF[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`; };
const CAL_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function dateWidget(id, name, val, req){
  return `<div class="dp" data-req="${req ? 1 : ''}"><input type="hidden" id="${id}" name="${name}" value="${esc(val)}">
    <button type="button" class="dp-btn" id="${id}-btn" data-act="dp-toggle" aria-expanded="false">${CAL_ICON}<span class="dp-label${val ? '' : ' muted'}">${esc(dpLabel(val))}</span></button>
    <div class="dp-pop" hidden></div></div>`;
}
function renderCal(dp){
  const pop = dp.querySelector('.dp-pop'), val = dp.querySelector('input').value;
  const [y, m] = dp.dataset.ym.split('-').map(Number);
  const start = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate(), t = todayStr();
  let cells = '';
  for(let i = 0; i < start; i++) cells += '<span></span>';
  for(let d = 1; d <= days; d++){
    const iso = `${y}-${pad(m)}-${pad(d)}`;
    cells += `<button type="button" data-act="dp-pick" data-date="${iso}" class="${iso === val ? 'sel' : ''}${iso === t ? ' today' : ''}" aria-label="${esc(dpLabel(iso))}">${d}</button>`;
  }
  pop.innerHTML = `<div class="dp-head"><button type="button" data-act="dp-nav" data-dir="-1" aria-label="Mês anterior">‹</button><b>${MOF[m - 1]} ${y}</b><button type="button" data-act="dp-nav" data-dir="1" aria-label="Próximo mês">›</button></div>
    <div class="dp-grid">${['D','S','T','Q','Q','S','S'].map(w => `<i>${w}</i>`).join('')}${cells}</div>
    <div class="dp-foot"><button type="button" data-act="dp-pick" data-date="${t}">Hoje</button>${dp.dataset.req ? '' : '<button type="button" data-act="dp-pick" data-date="">Sem data</button>'}</div>`;
}
function timeWidget(id, attr, val, label){
  const [h, mi] = (val || '').split(':');
  const mins = [...Array(12)].map((_, i) => pad(i * 5));
  if(mi && !mins.includes(mi)){ mins.push(mi); mins.sort(); }
  return `<div class="tp"><input type="hidden" ${attr} value="${esc(val || '')}">
    <select class="tp-h" id="${id}-h" aria-label="${label} — hora"><option value="">--</option>${[...Array(24)].map((_, i) => `<option ${pad(i) === h ? 'selected' : ''}>${pad(i)}</option>`).join('')}</select>
    <b>:</b>
    <select class="tp-m" id="${id}-m" aria-label="${label} — minutos"><option value="">--</option>${mins.map(x => `<option ${x === mi ? 'selected' : ''}>${x}</option>`).join('')}</select></div>`;
}
document.addEventListener('change', ev => {
  const tp = ev.target.closest('.tp'); if(!tp) return;
  const hs = tp.querySelector('.tp-h'), ms = tp.querySelector('.tp-m');
  if(hs.value && !ms.value) ms.value = '00';
  tp.querySelector('input').value = hs.value ? `${hs.value}:${ms.value}` : '';
});
function missingDate(form){ return [...form.querySelectorAll('.dp[data-req="1"]')].find(dp => !dp.querySelector('input').value); }

function fieldHtml([name,label,type,req,opts,full], val){
  const id = 'f-' + name, r = req ? ' required' : '';
  if(type === 'date') return `<div class="fld${full ? ' full' : ''}"><label for="${id}-btn">${label}</label>${dateWidget(id, name, val, req)}</div>`;
  if(type === 'time') return `<div class="fld${full ? ' full' : ''}"><label for="${id}-h">${label}</label>${timeWidget(id, `id="${id}" name="${name}"`, val, label)}</div>`;
  if(type === 'checkbox') return `<div class="fld check full"><input type="checkbox" id="${id}" name="${name}" ${val ? 'checked' : ''}><label for="${id}" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)">${label}</label></div>`;
  let ctl;
  if(type === 'select') ctl = `<select id="${id}" name="${name}"${r}>${opts.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if(type === 'combo') ctl = `<input type="text" id="${id}" name="${name}" value="${esc(val)}"${r} list="dl-${name}" autocomplete="off" placeholder="Digite ou escolha uma sugestão"><datalist id="dl-${name}">${opts.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
  else if(type === 'textarea') ctl = `<textarea id="${id}" name="${name}"${r}>${esc(val)}</textarea>`;
  else ctl = `<input type="${type}" id="${id}" name="${name}" value="${esc(val)}"${r} autocomplete="off">`;
  return `<div class="fld${full ? ' full' : ''}"><label for="${id}">${label}</label>${ctl}</div>`;
}
let rowSeq = 0;
const songRow = (m={}) => { const n = ++rowSeq; return `<div class="rrow m"><input id="ms-${n}-t" data-k="titulo" placeholder="Música" value="${esc(m.titulo)}" aria-label="Música"><input id="ms-${n}-a" data-k="artista" placeholder="Artista / ministério" value="${esc(m.artista)}" aria-label="Artista"><input id="ms-${n}-k" data-k="tom" placeholder="Tom" value="${esc(m.tom)}" aria-label="Tom"><button type="button" class="x" data-act="rmrow" aria-label="Remover">×</button></div>`; };
const ordRow = (o={}) => { const n = ++rowSeq; return `<div class="rrow o">${timeWidget('od-' + n, 'data-k="hora"', o.hora, 'Horário')}<input id="od-${n}-i" data-k="item" placeholder="Momento (ex.: Louvor)" value="${esc(o.item)}" aria-label="Momento"><input id="od-${n}-r" data-k="responsavel" placeholder="Responsável" value="${esc(o.responsavel)}" aria-label="Responsável"><button type="button" class="x" data-act="rmrow" aria-label="Remover">×</button></div>`; };

let editing = null;
function openForm(col, rec, defaults={}){
  const f = FORMS[col], isNew = !rec || !rec.id;
  const base = rec || {...defaults};
  if(col === 'tarefas'){ base.status = (STATUS.find(s => s[0] === (base.status || 'afazer')) || STATUS[0])[1]; }
  if(col === 'avisos' && !base.data) base.data = todayStr();
  const names = f.fields.map(fd => fd[0]);
  const extra = isNew ? Object.fromEntries(Object.entries(base).filter(([k]) => !names.includes(k) && !['id','musicas','ordem','criadoEm','atualizadoEm'].includes(k))) : {};
  editing = {col, id: rec && rec.id, extra, back: dlgMode === 'detail' ? {...detailCtx} : null};
  dlgMode = 'form';
  const dlg = $('#dlg');
  let body, actions;
  if(col === 'cultos'){
    const ms = (base.musicas && base.musicas.length) ? base.musicas : [{},{},{}];
    const od = base.ordem || [];
    const blocks = {
      '#musicas': `<div class="rep" id="rep-musicas"><div class="rep-h"><b>Músicas</b><button type="button" class="btn ghost" data-act="addrow" data-rep="musicas">+ Música</button></div><div class="rows">${ms.map(songRow).join('')}</div></div>`,
      '#ordem': `<div class="rep" id="rep-ordem"><div class="rep-h"><b>Momentos do evento</b><span class="row"><button type="button" class="btn ghost" data-act="padrao">Usar cronograma padrão</button><button type="button" class="btn ghost" data-act="addrow" data-rep="ordem">+ Momento</button></span></div><div class="rows">${od.map(ordRow).join('') || '<p class="muted hint" style="margin:0;font-size:14px">Adicione os momentos com horário e responsável, ou comece pelo cronograma padrão.</p>'}</div></div>`,
      '#resumo': '<div id="resumo"></div>'
    };
    const fmap = Object.fromEntries(f.fields.map(fd => [fd[0], fd]));
    body = `<nav class="steps" aria-label="Etapas">${CULTO_STEPS.map(([l], i) => `<button type="button" data-act="step" data-step="${i}"><span>${i+1}</span>${l}</button>`).join('')}</nav>`
      + CULTO_STEPS.map(([, items, hint], i) => `<div class="db" data-panel="${i}"${i ? ' hidden' : ''}><p class="hint-step">${hint}</p>${items.filter(k => !(base.eventoId && (k === 'nome' || k === 'tipo'))).map(k => k[0] === '#' ? blocks[k] : fieldHtml(fmap[k], base[k] ?? '')).join('')}</div>`).join('');
    actions = `<button type="button" class="btn" data-act="prev">← Anterior</button><button type="submit" class="btn" id="btn-save">Salvar</button><button type="button" class="btn primary" data-act="next">Próximo →</button><button type="submit" class="btn primary" data-pdf="1">Salvar e baixar PDF</button>`;
  } else {
    body = `<div class="db">${f.fields.map(fd => fieldHtml(fd, base[fd[0]] ?? '')).join('')}</div>`;
    actions = `<button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary" id="btn-save">Salvar</button>`;
  }
  dlg.innerHTML = `<form id="frm" novalidate>
    <div class="dh"><h2>${f.head ? (isNew ? (f.novo || 'Nova') + ' ' : 'Editar ') + f.head : (isNew ? 'Novo ' : 'Editar ') + f.title}</h2><button type="button" class="x" data-act="close" aria-label="Fechar">×</button></div>
    ${body}
    <div class="df"><span>${isNew ? '' : `<button type="button" class="btn danger" data-act="delete">Excluir</button>`}</span><span class="row">${actions}</span></div>
  </form>`;
  if(!dlg.open) dlg.showModal();
  if(col === 'cultos') setStep(0);
  else { const first = dlg.querySelector('input,select,textarea'); if(first) first.focus(); }
}

const CULTO_STEPS = [
  ['Dados gerais', ['nome','tipo','data','hora','serie','dirigente'], 'Quando é o evento e quem dirige.'],
  ['Palavra', ['tema','textos','preletor'], 'O tema da mensagem, os textos bíblicos e quem vai pregar.'],
  ['Louvor', ['louvor','#musicas'], 'Quem ministra o louvor e as músicas, com o tom da banda.'],
  ['Cronograma', ['#ordem'], 'Os momentos do evento com horário e responsável.'],
  ['Revisão', ['obs','#resumo'], 'Confira tudo, acrescente observações e gere o PDF para a equipe.']
];
let step = 0;
function setStep(i){
  step = Math.max(0, Math.min(CULTO_STEPS.length - 1, i));
  const last = step === CULTO_STEPS.length - 1;
  document.querySelectorAll('#dlg [data-panel]').forEach(p => p.hidden = +p.dataset.panel !== step);
  document.querySelectorAll('#dlg .steps button').forEach(b => b.setAttribute('aria-current', +b.dataset.step === step ? 'step' : 'false'));
  $('#dlg [data-act=prev]').hidden = step === 0;
  $('#dlg [data-act=next]').hidden = last;
  $('#dlg [data-pdf]').hidden = !last;
  if(last) renderResumo();
  const first = $(`#dlg [data-panel="${step}"]`).querySelector('input,select,textarea');
  if(first) first.focus();
}
function renderResumo(){
  const c = readForm($('#frm'), 'cultos'), warn = [];
  if(!c.data) warn.push('Falta a data do evento.');
  if(!c.tema) warn.push('Falta o tema da mensagem.');
  if(!c.preletor) warn.push('Nenhum preletor definido.');
  if(!c.dirigente) warn.push('Nenhum dirigente definido.');
  if(!c.musicas.length) warn.push('Nenhuma música registrada.');
  if(!c.ordem.length) warn.push('O cronograma está vazio.');
  const esq = c.data ? state.escalas.filter(e => e.data === c.data).length : 0;
  $('#resumo').innerHTML = `<div class="eyebrow">${esc(longDate(c.data))}${c.hora ? ' · ' + esc(c.hora) : ''}</div>
    <h3>${esc(c.tema || 'Evento sem tema definido')}</h3>
    <div class="muted">${[c.preletor && 'Preletor: ' + esc(c.preletor), c.dirigente && 'Dirigente: ' + esc(c.dirigente), c.louvor && 'Louvor: ' + esc(c.louvor)].filter(Boolean).join(' · ')}</div>
    <div class="row"><span class="chip">${c.musicas.length} música${c.musicas.length === 1 ? '' : 's'}</span><span class="chip">${c.ordem.length} momento${c.ordem.length === 1 ? '' : 's'}</span><span class="chip">${esq} equipe${esq === 1 ? '' : 's'} nesta data</span></div>
    ${warn.map(w => `<div class="warn">${w}</div>`).join('')}
    <div class="muted" style="font-size:13px">O PDF traz o cabeçalho do Youth, os dados do evento, o cronograma com horários, as músicas com tom e as observações.</div>`;
}

function collectRows(rep){
  return [...document.querySelectorAll(`#rep-${rep} .rrow`)].map(r => {
    const o = {}; r.querySelectorAll('input').forEach(i => o[i.dataset.k] = i.value.trim()); return o;
  }).filter(o => rep === 'musicas' ? o.titulo : o.item);
}
function readForm(form, col){
  const rec = {};
  FORMS[col].fields.forEach(([name,,type]) => {
    const el = form.elements[name];
    if(!el) return;
    rec[name] = type === 'checkbox' ? el.checked : el.value.trim();
  });
  if(col === 'tarefas') rec.status = (STATUS.find(s => s[1] === rec.status) || STATUS[0])[0];
  if(col === 'cultos'){ rec.musicas = collectRows('musicas'); rec.ordem = collectRows('ordem'); }
  return rec;
}

document.addEventListener('submit', async ev => {
  if(ev.target.id !== 'frm') return;
  ev.preventDefault();
  const form = ev.target;
  const noDate = missingDate(form);
  if(noDate){
    const p = noDate.closest('[data-panel]'); if(p) setStep(+p.dataset.panel);
    toast('Escolha a data no calendário.'); noDate.querySelector('.dp-btn').click(); return;
  }
  if(!form.checkValidity()){
    const bad = form.querySelector(':invalid'), p = bad && bad.closest('[data-panel]');
    if(p) setStep(+p.dataset.panel);
    form.reportValidity(); return;
  }
  const wantPdf = !!(ev.submitter && ev.submitter.dataset.pdf);
  const {col, id, extra, back} = editing;
  const old = id ? (state[col].find(x => x.id === id) || {}) : {};
  const rec = {...old, ...extra, ...readForm(form, col), id: id || uid()};
  if(!id) rec.criadoEm = new Date().toISOString();
  const btns = form.querySelectorAll('[type=submit]'); btns.forEach(b => b.disabled = true);
  const ok = await save(col, rec);
  if(ok){
    toast(FORMS[col].ok || (FORMS[col].title[0].toUpperCase() + FORMS[col].title.slice(1) + ' salvo'));
    if(back) openDetail(back.kind, back.id, back.tab);
    else if(col === 'eventos' && !id) openDetail('eventos', rec.id, 'resp');
    else $('#dlg').close();
    if(wantPdf) cultoPdf(rec);
    const linked = col === 'eventos' && id && state.cultos.find(x => x.eventoId === id);
    if(linked && (linked.data !== rec.data || linked.hora !== rec.hora)) save('cultos', {...linked, data: rec.data, hora: rec.hora});
  }
  else btns.forEach(b => b.disabled = false);
});

document.addEventListener('submit', async ev => {
  if(ev.target.id !== 'qedit') return;
  ev.preventDefault();
  const form = ev.target;
  const noDate = missingDate(form);
  if(noDate){ toast('Escolha a data no calendário.'); noDate.querySelector('.dp-btn').click(); return; }
  if(!form.checkValidity()){ form.reportValidity(); return; }
  const it = findItem(detailCtx.kind, detailCtx.id); if(!it) return;

/* ---------- Marcações (@) e sino ----------
   Mentions are matched by name, so people without a claude.ai account can be marked.
   "Who am I" and what was already read stay in this browser only. */
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function knownPeople(){
  const m = new Map();
  const add = v => String(v || '').split(/\s*,\s*/).forEach(x => { x = x.trim(); if(x && x.length <= 60 && !m.has(norm(x))) m.set(norm(x), x); });
  state.eventos.forEach(e => { add(e.responsavel); (e.marcados || []).forEach(add); });
  state.cultos.forEach(c => { add(c.dirigente); add(c.preletor); add(c.louvor); (c.ordem || []).forEach(o => add(o.responsavel)); (c.marcados || []).forEach(add); });
  state.escalas.forEach(e => add(e.responsavel));
  state.tarefas.forEach(t => add(t.responsavel));
  (typeof equipe !== 'undefined' ? equipe : []).forEach(x => add(memberName(x)));
  return [...m.values()].sort((a, b) => a.localeCompare(b, 'pt'));
}
function computeMentions(text){
  const nt = norm(text), out = new Map();
  [...knownPeople(), ...((detailCtx && detailCtx.picked) || [])].forEach(n => { if(nt.includes('@' + norm(n))) out.set(norm(n), n); });
  for(const m of text.matchAll(/@([\p{L}][\p{L}\p{N}.\-]*)/gu)){
    const tok = m[1].replace(/[.\-]+$/, ''), k = norm(tok);
    if(tok && ![...out.keys()].some(x => x === k || x.startsWith(k + ' '))) out.set(k, tok);
  }
  const keys = [...out.keys()];
  return keys.filter(k => !keys.some(o => o !== k && o.startsWith(k + ' '))).map(k => out.get(k));
}
function withMentions(text, names){
  let h = esc(text); const marks = [];
  [...names].sort((a, b) => b.length - a.length).forEach(n => { const t = esc('@' + n); if(h.includes(t)){ h = h.split(t).join('\u0000' + marks.length + '\u0000'); marks.push(t); } });
  return h.replace(/\u0000(\d+)\u0000/g, (_, i) => `<span class="mention">${marks[i]}</span>`);
}
function mentionQuery(ta){ const m = ta.value.slice(0, ta.selectionStart).match(/@([^@\n]{0,40})$/); return m ? m[1] : null; }
// Shared @-picker: event Observações (#obs-text → #mlist) and the team chat (#chat-text → #chat-mlist).
let mentionTa = null;
const mentionBox = ta => ta && ta.id === 'chat-text' ? $('#chat-mlist') : $('#mlist');
// Only people with a login (public.membros) can be marked; the painel's other names are not offered.
const mentionPeople = ta => !sb ? knownPeople()
  : [...new Set(equipe.filter(m => !sbUser || lower(m.email) !== lower(sbUser.email)).map(memberName))].sort((a, b) => a.localeCompare(b, 'pt'));
function renderMentionList(ta){
  mentionTa = ta;
  const box = mentionBox(ta); if(!box) return;
  const q = mentionQuery(ta);
  if(q === null){ box.hidden = true; return; }
  const nq = norm(q);
  const opts = mentionPeople(ta).filter(n => !nq || norm(n).startsWith(nq) || norm(n).split(' ').some(w => w.startsWith(nq))).slice(0, 6);
  if(!opts.length && /\s/.test(q) && q.trim().length > 12){ box.hidden = true; return; }
  const exact = opts.some(n => norm(n) === nq);
  box.innerHTML = opts.map(n => `<button type="button" data-act="pick" data-name="${esc(n)}">@${esc(n)}</button>`).join('')
    + (!sb && q.trim() && !exact ? `<button type="button" data-act="pick" data-name="${esc(q.trim())}">Marcar “${esc(q.trim())}”</button>` : '')
    || `<span class="muted" style="padding:6px 8px;font-size:13px">${sb ? (mentionPeople(ta).length ? 'Nenhum usuário com esse nome. Só quem tem login no app pode ser marcado.' : 'Ainda não há outros usuários cadastrados no app.') : 'Digite o nome de quem você quer marcar.'}</span>`;
  box.hidden = false;
}
function pickMention(name){
  const ta = mentionTa && mentionTa.isConnected ? mentionTa : $('#obs-text'); if(!ta) return;
  const q = mentionQuery(ta); if(q === null) return;
  const pos = ta.selectionStart, start = pos - q.length - 1;
  ta.value = ta.value.slice(0, start) + '@' + name + ' ' + ta.value.slice(pos);
  const caret = start + name.length + 2;
  ta.focus(); ta.setSelectionRange(caret, caret);
  if(ta.id === 'obs-text' && detailCtx){ detailCtx.picked = [...(detailCtx.picked || []), name]; detailCtx.obsDirty = true; }
  const box = mentionBox(ta); if(box) box.hidden = true;
}

/* ---------- Backup ---------- */
async function saveFile(filename, data){
  let dl = null;
  try { dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch(e){}
  if(!dl){
    // Standalone webapp: a normal browser download.
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Download iniciado'); return;
  }
  try { await dl.save({filename, data}); toast('Arquivo salvo'); }
  catch(e){ if(e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'Já existe um download aguardando confirmação.' : 'Não foi possível baixar o arquivo.'); }
}
async function downloadBackup(csv){
  if(isLoading(COLS)){ toast('Aguarde os dados carregarem.'); return; }
  if(!csv){
    const data = {painel: 'Painel Youth', geradoEm: new Date().toISOString(), colecoes: Object.fromEntries(COLS.map(c => [c, state[c]]))};
    return saveFile(`backup-painel-youth-${todayStr()}.json`, new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}));
  }
  const q = v => '"' + String(v ?? '').replace(/"/g, '""').replace(/\r?\n/g, ' ') + '"';
  const head = ['Data','Horário','Evento','Tipo','Local','Responsável','Tema','Preletor','Dirigente','Equipes','Detalhes','Observações'];
  const rows = byDate(agendaItems().filter(x => x.data)).map(it => {
    const c = it.culto || {};
    return [it.data.split('-').reverse().join('/'), it.hora, it.titulo, it.tipo, it.local, it.resp, c.tema, c.preletor, c.dirigente,
      escalasFor(it).map(e => e.area + (e.responsavel ? ' (' + e.responsavel + ')' : '')).join(', '), it.kind === 'eventos' ? it.rec.descricao : '', it.rec.observacoes].map(q).join(';');
  });
  return saveFile(`agenda-youth-${todayStr()}.csv`, new Blob(['﻿' + [head.map(q).join(';'), ...rows].join('\r\n')], {type: 'text/csv'}));
}

function longDate(s){ if(!s) return 'Data a definir'; const d = parseD(s); return `${WDF[d.getDay()]}, ${d.getDate()} de ${MOF[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`; }

function buildCultoPdf(c){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const PW = 210, PH = 297, M = 18, CW = PW - 2*M;
  const INK = [11,11,12], MUTED = [94,90,85], ACC = [232,0,63], SUN = [255,208,4], LINE = [226,222,214], ZEBRA = [241,239,234];
  let y = 0;
  const color = c3 => doc.setTextColor(c3[0], c3[1], c3[2]);
  const font = (style, size) => { doc.setFont('helvetica', style); doc.setFontSize(size); };
  const ensure = h => { if(y + h > PH - 18){ doc.addPage(); y = 20; } };
  const section = title => {
    ensure(18); y += 6;
    font('bold', 9); color(ACC); doc.text(title.toUpperCase(), M, y, {charSpace:0.4});
    y += 2.5; doc.setDrawColor(INK[0], INK[1], INK[2]); doc.setLineWidth(0.5); doc.line(M, y, PW - M, y); y += 6;
  };

  doc.setFillColor(INK[0], INK[1], INK[2]); doc.rect(0, 0, PW, 32, 'F');
  let logoOk = false;
  if(LOGO_DATA){ try { doc.addImage(LOGO_DATA, 'PNG', M, 5, 42, 18); logoOk = true; } catch(e){} }
  if(!logoOk){ font('bold', 26); doc.setTextColor(255,255,255); doc.text('YOUTH*', M, 18); }
  font('normal', 9); doc.setTextColor(163,160,154); doc.text('EVENTO YOUTH', M, 28.5, {charSpace:0.3});
  [[254,0,62,4],[255,208,4,3],[90,17,231,2],[135,135,135,1]].reduce((x, [r,g,b,w]) => { const ww = PW * w / 10; doc.setFillColor(r,g,b); doc.rect(x, 32, ww, 1.8, 'F'); return x + ww; }, 0);
  doc.setFillColor(SUN[0], SUN[1], SUN[2]); doc.roundedRect(PW - M - 46, 11, 46, 12, 2, 2, 'F');
  font('bold', 10); doc.setTextColor(43,34,0);
  doc.text(c.data ? c.data.split('-').reverse().join('/') : 'A definir', PW - M - 23, 16, {align:'center'});
  font('normal', 8); doc.text(c.hora ? 'às ' + c.hora : 'horário a definir', PW - M - 23, 20.5, {align:'center'});

  y = 44;
  font('bold', 10); color(MUTED); doc.text(longDate(c.data).toUpperCase() + (c.hora ? '  ·  ' + c.hora : ''), M, y);
  y += 9;
  font('bold', 21); color(INK);
  const tl = doc.splitTextToSize(c.tema || 'Evento sem tema definido', CW);
  doc.text(tl, M, y); y += tl.length * 8.5;
  if(c.serie){ font('normal', 11); color(MUTED); doc.text('Série: ' + c.serie, M, y); y += 6; }

  const info = [['Preletor', c.preletor], ['Dirigente', c.dirigente], ['Ministro de louvor', c.louvor], ['Texto bíblico', c.textos]].filter(x => x[1]);
  if(info.length){
    y += 3;
    const colW = (CW - 8) / 2;
    for(let i = 0; i < info.length; i += 2){
      const pair = info.slice(i, i + 2);
      const lines = pair.map(([, v]) => { font('bold', 11.5); return doc.splitTextToSize(v, colW); });
      const h = 6 + Math.max(...lines.map(l => l.length)) * 5.2;
      ensure(h + 2);
      pair.forEach(([k], j) => {
        const x = M + j * (colW + 8);
        font('bold', 7.5); color(MUTED); doc.text(k.toUpperCase(), x, y, {charSpace:0.3});
        font('bold', 11.5); color(INK); doc.text(lines[j], x, y + 5.5);
      });
      y += h + 2;
    }
  }

  const ordem = c.ordem || [];
  if(ordem.length){
    section('Ordem do evento');
    const cH = 22, cR = 52, cI = CW - cH - cR;
    font('bold', 7.5); color(MUTED);
    doc.text('HORÁRIO', M + 2, y); doc.text('MOMENTO', M + cH, y); doc.text('RESPONSÁVEL', M + cH + cI, y); y += 3;
    ordem.forEach((o, i) => {
      font('bold', 11); const il = doc.splitTextToSize(o.item || '', cI - 4);
      font('normal', 10); const rl = doc.splitTextToSize(o.responsavel || '', cR - 2);
      const h = Math.max(il.length, rl.length, 1) * 5 + 4;
      ensure(h);
      if(i % 2 === 0){ doc.setFillColor(ZEBRA[0], ZEBRA[1], ZEBRA[2]); doc.rect(M, y, CW, h, 'F'); }
      const ty = y + 5.6;
      font('bold', 10.5); color(ACC); doc.text(o.hora || '—', M + 2, ty);
      font('bold', 11); color(INK); doc.text(il, M + cH, ty);
      font('normal', 10); color(MUTED); doc.text(rl, M + cH + cI, ty);
      y += h;
    });
  }

  const ms = c.musicas || [];
  if(ms.length){
    section('Músicas');
    ms.forEach((m, i) => {
      font('bold', 11); const tl2 = doc.splitTextToSize(m.titulo, CW - 40);
      const h = tl2.length * 5 + (m.artista ? 5 : 0) + 4;
      ensure(h);
      font('bold', 10); color(MUTED); doc.text(String(i + 1).padStart(2, '0'), M, y + 4.5);
      font('bold', 11); color(INK); doc.text(tl2, M + 10, y + 4.5);
      if(m.artista){ font('normal', 9.5); color(MUTED); doc.text(m.artista, M + 10, y + 4.5 + tl2.length * 5); }
      if(m.tom){
        doc.setFillColor(SUN[0], SUN[1], SUN[2]); doc.roundedRect(PW - M - 22, y + 0.5, 22, 6.5, 1.5, 1.5, 'F');
        font('bold', 9); doc.setTextColor(43,34,0); doc.text('Tom ' + m.tom, PW - M - 11, y + 5, {align:'center'});
      }
      y += h;
      doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setLineWidth(0.2); doc.line(M + 10, y - 1.5, PW - M, y - 1.5);
    });
  }

  const esc2 = c.data ? escalasFor(itemOfCulto(c)) : [];
  if(esc2.length){
    section('Equipes');
    esc2.forEach(e => {
      font('normal', 10.5); const pl = doc.splitTextToSize([e.responsavel && 'Responsável: ' + e.responsavel, e.obs && '(' + e.obs + ')'].filter(Boolean).join(' · ') || '-', CW - 48);
      font('bold', 10); const nl = doc.splitTextToSize(e.area || '', 44);
      const h = Math.max(pl.length, nl.length) * 5 + 3;
      ensure(h);
      font('bold', 10); color(INK); doc.text(nl, M, y + 4);
      font('normal', 10.5); color(INK); doc.text(pl, M + 48, y + 4);
      y += h;
    });
  }

  if(c.obs){
    section('Observações');
    font('normal', 10.5); color(INK);
    doc.splitTextToSize(c.obs, CW).forEach(l => { ensure(5.5); doc.text(l, M, y); y += 5.2; });
  }

  const n = doc.getNumberOfPages(), now = new Date();
  for(let p = 1; p <= n; p++){
    doc.setPage(p);
    doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setLineWidth(0.2); doc.line(M, PH - 12, PW - M, PH - 12);
    font('normal', 8); color(MUTED);
    doc.text(`Painel Youth · gerado em ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`, M, PH - 7);
    doc.text(`Página ${p} de ${n}`, PW - M, PH - 7, {align:'right'});
  }
  return doc;
}

  else if(act === 'seg'){ seg[b.dataset.key] = b.dataset.val; render(); }
  else if(act === 'new'){ const d = {}; if(b.dataset.date) d.data = b.dataset.date; if(b.dataset.ref) d.ref = b.dataset.ref;
    else if(b.dataset.col === 'escalas'){ const p = byDate(state.cultos.filter(c => c.data >= todayStr()))[0]; if(p){ const it = itemOfCulto(p); d.data = p.data; d.ref = it.kind + ':' + it.id; } }
    openForm(b.dataset.col, null, d); }
  else if(act === 'open'){ openDetail(b.dataset.kind, b.dataset.id, b.dataset.tab); }
  else if(act === 'bell'){ const p = $('#bellpop'); p.hidden = !p.hidden; renderBell(); }
  else if(act === 'notif'){ $('#bellpop').hidden = true; openDetail(b.dataset.kind, b.dataset.id, 'obs'); }
  else if(act === 'pick'){ pickMention(b.dataset.name); }
  else if(act === 'backup-json' || act === 'backup-csv'){ b.disabled = true; await downloadBackup(act === 'backup-csv'); b.disabled = false; }
  else if(act === 'senha'){ openSenha(); }
  else if(act === 'logout'){
    // Local sign-out never needs the network; then clear any leftover session keys so the reload lands on the login screen.
    b.disabled = true; b.textContent = 'Saindo…';
    // This device stops receiving this person's notifications.
    try { if(sb && pushSupported()){ const reg = await navigator.serviceWorker.ready, s = await reg.pushManager.getSubscription(); if(s){ await sb.from('push_subs').delete().eq('endpoint', s.endpoint); await s.unsubscribe(); } } } catch(e){}
    try { if(sb) await sb.auth.signOut({scope: 'local'}); } catch(e){}
    try { Object.keys(localStorage).filter(k => /^sb-.*auth-token/.test(k)).forEach(k => localStorage.removeItem(k)); } catch(e){}
    location.replace(location.pathname);
  }
  else if(act === 'hist-reload'){ hist.loaded = false; render(); }
  else if(act === 'cal-dia'){ calDia = b.dataset.dia; render(); const d = $('.cal-dia'); if(d && matchMedia('(max-width: 640px)').matches) d.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  else if(act === 'cal-nav'){ const [y, m] = calMes.split('-').map(Number), d = new Date(y, m - 1 + (+b.dataset.dir), 1); calMes = d.getFullYear() + '-' + pad(d.getMonth() + 1); render(); }
  else if(act === 'cal-hoje'){ calMes = todayStr().slice(0, 7); calDia = todayStr(); render(); }
  else if(act === 'addcal'){ const it = findItem(b.dataset.kind, b.dataset.id); if(it) addToCalendar(it, b.dataset.tipo); }
  else if(act === 'notif-chat'){ $('#bellpop').hidden = true; openChat(); }
  else if(act === 'chat-open'){ openChat(); }
  else if(act === 'online'){ if(online.length) toast('Online agora: ' + online.map(p => p.nome).join(', ')); }
  else if(act === 'chat-close'){ closeChat(); }
  else if(act === 'chat-hide'){ setFabHidden(true); toast('Botão do chat escondido. Para trazer de volta, use "Mostrar chat" no rodapé.'); }
  else if(act === 'chat-show'){ setFabHidden(false); openChat(); }
  else if(act === 'chat-name'){
    const cur = myName(), box = b.closest('.chat-as');
    box.innerHTML = `<input id="chat-name-in" value="${esc(getMe() || cur)}" maxlength="40" aria-label="Seu nome no chat"> <button type="button" class="linkbtn" data-act="chat-name-ok">salvar</button>`;
    $('#chat-name-in').focus();
  }
  else if(act === 'chat-name-ok'){
    const v = ($('#chat-name-in').value || '').trim(); const box = b.closest('.chat-as');
    if(v) await saveMyName(v);
    box.innerHTML = `Você aparece como <b id="chat-me">${esc(myName())}</b> · <button type="button" class="linkbtn" data-act="chat-name">trocar nome</button>`;
  }
  else if(act === 'menu'){ const p = $('#menupop'); p.hidden = !p.hidden; b.setAttribute('aria-expanded', String(!p.hidden)); if(!p.hidden) renderMenu(); }
  else if(act === 'menu-name'){
    const row = b.closest('.mrow');
    row.innerHTML = `<div class="fld" style="flex:1"><label for="menu-name-in">Seu nome na equipe</label><input id="menu-name-in" value="${esc(myName())}" maxlength="40" autocomplete="off"></div><button type="button" class="btn primary" data-act="menu-name-ok">Salvar</button>`;
    $('#menu-name-in').focus(); $('#menu-name-in').select();
  }
  else if(act === 'menu-name-ok'){
    const v = ($('#menu-name-in').value || '').trim();
    if(!v){ toast('Escreva um nome.'); return; }
    b.disabled = true; await saveMyName(v); renderMenu();
  }
  else if(act === 'menu-senha'){ $('#menupop').hidden = true; openSenha(); }
  else if(act === 'notif-task'){
    $('#bellpop').hidden = true;
    markSeen(b.dataset.key); renderBell();
    openTask(b.dataset.id);
  }
  else if(act === 'menu-equipe'){ $('#menupop').hidden = true; openEquipe(); }
  else if(act === 'menu-push'){ b.disabled = true; await enablePush(); }
  else if(act === 'menu-push-off'){ b.disabled = true; await disablePush(); }
  else if(act === 'u-new'){ adminEdit = '__novo'; renderEquipe(); setTimeout(() => { const f = $('#un-email'); if(f) f.focus(); }, 0); }
  else if(act === 'u-edit'){ adminEdit = b.dataset.email; renderEquipe(); }
  else if(act === 'u-cancel'){ adminEdit = null; renderEquipe(); }
  else if(act === 'u-del'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Clique de novo para remover'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Remover acesso'; } }, 4000); return; }
    const {error} = await sb.rpc('admin_remover_usuario', {p_email: b.dataset.email});
    if(error){ toast('Não foi possível remover: ' + error.message); return; }
    toast('Acesso removido'); adminEdit = null; await loadAdminUsers(); await loadEquipe(); renderEquipe();
  }
  else if(act === 'menu-chat'){ $('#menupop').hidden = true; setFabHidden(false); openChat(); }
  else if(act === 'mdel'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'confirmar?'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'apagar'; } }, 4000); return; }
    const {error} = await sb.from('mensagens').delete().eq('id', b.dataset.id);
    if(error){ toast('Não foi possível apagar: ' + error.message); return; }
    chatMsgs = chatMsgs.filter(m => m.id !== b.dataset.id); chatChanged();
  }
  else if(act === 'pasta'){ pastaAberta = b.dataset.pasta || null; render(); window.scrollTo(0, 0); }
  else if(act === 'fopen' || act === 'fdown'){
    const f = state.arquivos.find(x => x.id === b.dataset.id); if(!f) return;
    b.disabled = true; const url = await fileUrl(f, act === 'fdown'); b.disabled = false;
    if(url) openUrl(url, act === 'fdown');
  }
  else if(act === 'fdel'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Confirmar'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Excluir'; } }, 4000); return; }
    const f = state.arquivos.find(x => x.id === b.dataset.id); if(!f) return;
    const rm = await sb.storage.from('arquivos').remove([f.caminho]);
    if(rm.error){ toast('Não foi possível excluir: ' + rm.error.message); return; }
    if(await removeRec('arquivos', f.id)) toast('Arquivo excluído');
  }
  else if(act === 'topen'){ openTask(b.dataset.id); }
  else if(act === 'tcheck'){ b.disabled = true; await toggleTask(b.dataset.id); }
  else if(act === 'tdcheck'){
    if(document.querySelectorAll('#tlist .titem').length){ toast('Marque os itens do checklist: a tarefa é concluída quando todos estiverem feitos.'); return; }
    const s = $('#t-status'); s.value = s.value === 'feito' ? 'afazer' : 'feito'; b.classList.toggle('on', s.value === 'feito');
  }
  else if(act === 'titem-rm'){ b.closest('.titem').remove(); updateProg(); syncStatusFromChecklist(); }
  else if(act === 'tdel'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Clique de novo para excluir'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Excluir'; } }, 4000); return; }
    if(await removeRec('tarefas', taskCtx.id)){ toast('Tarefa excluída'); $('#dlg').close(); }
  }
  else if(act === 'dp-toggle'){
    const dp = b.closest('.dp'), pop = dp.querySelector('.dp-pop'), open = pop.hidden;
    document.querySelectorAll('.dp-pop').forEach(p => { p.hidden = true; p.closest('.dp').querySelector('.dp-btn').setAttribute('aria-expanded', 'false'); });
    if(open){ const v = dp.querySelector('input').value || todayStr(); dp.dataset.ym = v.slice(0, 7); renderCal(dp); pop.hidden = false; b.setAttribute('aria-expanded', 'true'); }
  }
  else if(act === 'dp-nav'){
    const dp = b.closest('.dp'); let [y, m] = dp.dataset.ym.split('-').map(Number);
    m += +b.dataset.dir; if(m < 1){ m = 12; y--; } if(m > 12){ m = 1; y++; }
    dp.dataset.ym = `${y}-${pad(m)}`; renderCal(dp);
  }
  else if(act === 'dp-pick'){
    const dp = b.closest('.dp'), v = b.dataset.date, lab = dp.querySelector('.dp-label');
    dp.querySelector('input').value = v; lab.textContent = dpLabel(v); lab.classList.toggle('muted', !v);
    dp.querySelector('.dp-pop').hidden = true; dp.querySelector('.dp-btn').setAttribute('aria-expanded', 'false'); dp.querySelector('.dp-btn').focus();
  }
  else if(act === 'qopen'){ detailCtx.editOpen = true; renderDetail(); const f = $('#qedit input'); if(f) f.focus(); }
  else if(act === 'qcancel'){ detailCtx.editOpen = false; renderDetail(); }
  else if(act === 'qdel'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Clique de novo para excluir'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Excluir evento'; } }, 4000); return; }
    if(await removeRec(detailCtx.kind, detailCtx.id)){ toast('Evento excluído'); $('#dlg').close(); }
  }
  else if(act === 'dtab'){ detailCtx.tab = b.dataset.tab; detailCtx.obsDirty = false; renderDetail(); }
  else if(act === 'mkculto'){ const it = findItem(detailCtx.kind, detailCtx.id); if(it) openForm('cultos', null, {data: it.data, hora: it.hora, eventoId: it.id}); }
  else if(act === 'edit'){ const r = state[b.dataset.col].find(x => x.id === b.dataset.id); if(r) openForm(b.dataset.col, r); }
  else if(act === 'dup'){ const r = state.cultos.find(x => x.id === b.dataset.id); if(r){ const c = JSON.parse(JSON.stringify(r)); delete c.id; delete c.criadoEm; delete c.eventoId; c.data = ''; openForm('cultos', null, c); } }
  else if(act === 'move'){ const r = state.tarefas.find(x => x.id === b.dataset.id); if(r){ b.disabled = true; await save('tarefas', {...r, status: b.dataset.to}); } }
  else if(act === 'close'){ if(dlgMode === 'form' && editing && editing.back) openDetail(editing.back.kind, editing.back.id, editing.back.tab); else $('#dlg').close(); }
  else if(act === 'step'){ setStep(+b.dataset.step); }
  else if(act === 'prev'){ setStep(step - 1); }
  else if(act === 'next'){ setStep(step + 1); }
  else if(act === 'pdf'){ const r = state.cultos.find(x => x.id === b.dataset.id); if(r) cultoPdf(r); }
  else if(act === 'addrow'){ const box = $(`#rep-${b.dataset.rep} .rows`); box.querySelector('.hint')?.remove(); box.insertAdjacentHTML('beforeend', b.dataset.rep === 'musicas' ? songRow() : ordRow()); box.lastElementChild.querySelector('input').focus(); }
  else if(act === 'rmrow'){ b.closest('.rrow').remove(); }
  else if(act === 'padrao'){ const box = $('#rep-ordem .rows'); const dir = $('#f-dirigente')?.value || '', pre = $('#f-preletor')?.value || '', lv = $('#f-louvor')?.value || '';
    box.innerHTML = ORDEM_PADRAO.map(([h,i,who]) => ordRow({hora:h, item:i, responsavel: {dir, lv, pre}[who] || ''})).join(''); }
  else if(act === 'delete'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Clique de novo para excluir'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Excluir'; } }, 4000); return; }
    const {col, id, back} = editing;
    if(await removeRec(col, id)){
      toast('Excluído');
      if(back && !(back.kind === col && back.id === id)) openDetail(back.kind, back.id, back.tab); else $('#dlg').close();
    }
  }
});
$('#dlg').addEventListener('click', ev => { if(ev.target.id === 'dlg') ev.target.close(); });
$('#dlg').addEventListener('close', () => { dlgMode = null; editing = null; });

init();
</script>

<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
